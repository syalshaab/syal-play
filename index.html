    const LX = [35, 105, 175], PY = 330, GOAL = 1000, W = 260, H = 420;
    let state = online ? 'idle' : 'ready', lane = 1, px = LX[1], d = 0, lives = 3, obs = [];
    let cpu = 0, tk = 0, room = null, off = () => {}, myFin = 0, oppD = 0, oppL = 2, oppFin = 0, seen = false, raf;
    const opp = () => (room ? room.peers().find(p => !p.isMe && p.kind === 'viewer' && p.presence && p.presence.t) : null);
    const move = dir => { lane = Math.max(0, Math.min(2, lane + dir)); };
    const reset = () => { lane = 1; px = LX[1]; d = 0; lives = 3; obs = []; cpu = 0; myFin = 0; oppFin = 0; };
    const showRestart = label => { $('rg').textContent = label; $('rg').style.display = ''; };
    const finish = win => {
      const won = win && !(online && oppFin);
      state = won ? 'won' : 'lost';
      if (won) myFin = Date.now();
      if (online && room) room.presence({ t: Date.now(), d: Math.round(d), l: lane, f: myFin });
      showRestart('Play again');
    };
    const step = () => {
      d += Math.min(9, 5 + d / 300) * 0.1;
      cpu += 0.5 + Math.random() * 0.08;
      px += (LX[lane] - px) * 0.25;
      if (Math.random() < 0.03) obs.push({ l: rand(3), y: -80 });
      obs.forEach(o => { o.y += 3 + d / 300; });
      for (const o of obs) {
        if (!o.hit && o.l === lane && o.y < PY + 72 && o.y + 72 > PY) {
          o.hit = true; lives--; d = Math.max(0, d - 25);
          if (lives <= 0) { state = 'over'; showRestart('Try again'); }
        }
      }
      obs = obs.filter(o => !o.hit && o.y < H + 10);
    };
    const car = (x, y, c) => {
      ctx.fillStyle = c; ctx.fillRect(x - 20, y, 40, 72);
      ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(x - 15, y + 12, 30, 16);
      ctx.fillStyle = 'rgba(255,255,255,.45)'; ctx.fillRect(x - 15, y + 54, 30, 6);
    };
    const draw = () => {
      ctx.fillStyle = '#14308f'; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#2b2750'; ctx.fillRect(0, 0, 210, H);
      ctx.strokeStyle = 'rgba(255,255,255,.4)'; ctx.lineWidth = 3; ctx.setLineDash([22, 18]);
      ctx.lineDashOffset = -((d * 20) % 40);
      ctx.beginPath(); ctx.moveTo(70, 0); ctx.lineTo(70, H); ctx.moveTo(140, 0); ctx.lineTo(140, H); ctx.stroke();
      ctx.setLineDash([]);
      obs.forEach(o => car(LX[o.l], o.y, '#ffd23f'));
      const showRival = !online || seen;
      const rivalD = online ? oppD : cpu, rivalL = online ? oppL : 2;
      const ry = PY - (rivalD - d) * 2;
      if (showRival && ry > -80 && ry < H) car(LX[rivalL], ry, '#2e9bff');
      car(px, PY, '#ff5d73');
      ctx.fillStyle = 'rgba(255,255,255,.2)'; ctx.fillRect(236, 20, 10, 380);
      const yy = m => 400 - Math.min(GOAL, Math.max(0, m)) / GOAL * 380;
      if (showRival) { ctx.fillStyle = '#2e9bff'; ctx.fillRect(231, yy(rivalD) - 4, 20, 8); }
      ctx.fillStyle = '#ff5d73'; ctx.fillRect(231, yy(d) - 4, 20, 8);
      $('rd').textContent = Math.floor(d);
      $('rv').textContent = lives;
      if (state !== 'play') {
        const [h, s] = { idle: ['Join a room', 'Enter a room code above'], ready: ['Ready?', 'Press Start'], wait: ['Waiting...', 'Waiting for a friend to join'], won: ['You win!', Math.floor(d) + ' m'], lost: ['You lose', 'Better luck next race'], over: ['Crashed out', 'Press Try again'] }[state];
        ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillRect(0, 150, 210, 110);
        ctx.fillStyle = '#fff'; ctx.textAlign = 'center';
        ctx.font = '800 24px system-ui, sans-serif'; ctx.fillText(h, 105, 190);
        ctx.font = '600 15px system-ui, sans-serif'; ctx.fillText(s, 105, 220);
      }
    };
    const loop = () => {
      tk++;
      if (online && room && tk % 10 === 0) {
        const o = opp();
        if (o) {
          seen = true;
          oppD = o.presence.d || 0;
          oppL = o.presence.l == null ? 2 : o.presence.l;
          oppFin = o.presence.f || 0;
          if (state === 'wait') { reset(); state = 'play'; $('rg').style.display = 'none'; }
        }
        room.presence({ t: Date.now(), d: Math.round(d), l: lane, f: myFin });
      }
      if (state === 'play') {
        step();
        if (d >= GOAL) finish(true);
        else if (!online && cpu >= GOAL) finish(false);
        else if (online && oppFin && !myFin) finish(false);
      }
      draw();
      raf = requestAnimationFrame(loop);
    };
    const onKey = e => {
      if (e.target && e.target.tagName === 'INPUT') return;
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') { e.preventDefault(); move(-1); }
      else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') { e.preventDefault(); move(1); }
    };
    document.addEventListener('keydown', onKey);
    $('rlf').onclick = () => move(-1);
    $('rrt').onclick = () => move(1);
    cv.addEventListener('pointerdown', e => { const r = cv.getBoundingClientRect(); move((e.clientX - r.left) * (W / r.width) < W / 2 ? -1 : 1); });
    $('rg').onclick = () => {
      if (online && !room) return;
      reset();
      state = online ? (opp() ? 'play' : 'wait') : 'play';
      $('rg').style.display = 'none';
      $('rg').blur();
    };
    if (online) lobby('lane', t => { $('rm').textContent = t; }, r => {
      room = r;
      off = room.onPeers(() => {});
      reset();
      state = 'wait';
    });
    draw();
    raf = requestAnimationFrame(loop);
    return () => { cancelAnimationFrame(raf); off(); document.removeEventListener('keydown', onKey); if (room) room.leave(); };
  };
}

add('battle', 'Zone Royale', '🪂', 'Arcade', 'Drop in, loot up, and be the last one standing in the shrinking ring.', battle);

function battle() {
  app.innerHTML = `
  <div class='panel'>
    <div class='hud'><span>Alive <b id='bA'>15</b></span><span>Ammo <b id='bM'>30</b></span><span>HP <b id='bH'>100</b></span><button class='btn' id='bG'>Drop in</button></div>
    <canvas id='bC' class='cv' width='320' height='420' aria-label='Zone Royale battlefield'></canvas>
    <p class='hint'>PC: WASD to move, mouse to aim, click or hold Space to fire. Phone: drag the left side to move, hold the right side to aim and fire. Stay inside the white ring.</p>
  </div>`;
  const cv = $('bC'), ctx = cv.getContext('2d');
  const W = 320, H = 420, WORLD = 1200, C0 = 600, STAGES = [520, 360, 230, 120, 40];
  const keys = {};
  let P = null, bots = [], items = [], bullets = [], zone = null, stick = null, aim = null, fireId = null, state = 'idle', raf;
  const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
  const bound = v => Math.max(16, Math.min(WORLD - 16, v));
  const ring = (r, a) => ({ x: C0 + Math.cos(a) * r, y: C0 + Math.sin(a) * r });
  const shoot = (o, ang, who) => bullets.push({ x: o.x + Math.cos(ang) * 16, y: o.y + Math.sin(ang) * 16, vx: Math.cos(ang) * 7, vy: Math.sin(ang) * 7, life: 60, who });
  const drop = () => {
    P = { x: C0, y: C0 + 120, hp: 100, ang: -1.57, cd: 0, ammo: 30 };
    bots = Array.from({ length: 14 }, () => { const p = ring(Math.random() * 480, Math.random() * 6.28); return { x: p.x, y: p.y, hp: 100, cd: rand(40), t: 0, tx: p.x, ty: p.y, ang: 0, alive: true }; });
    items = Array.from({ length: 45 }, () => ({ x: 40 + rand(WORLD - 80), y: 40 + rand(WORLD - 80), k: Math.random() < 0.6 ? 'a' : 'm' }));
    bullets = [];
    zone = { r: 620, k: 0, phase: 'hold', t: 0, from: 620, to: 620 };
    aim = null; stick = null; fireId = null;
    state = 'play';
    $('bG').textContent = 'Restart';
    $('bG').blur();
  };
  const think = b => {
    if (!b.alive) return;
    b.cd--; b.t--;
    const dp = dist(b, P), outside = dist(b, { x: C0, y: C0 }) > zone.r - 12;
    if (outside) { b.tx = C0; b.ty = C0; }
    else if (dp < 260) {
      b.ang = Math.atan2(P.y - b.y, P.x - b.x);
      if (b.cd <= 0) { shoot(b, b.ang + (Math.random() - 0.5) * 0.3, 'b'); b.cd = 40 + rand(30); }
      return;
    } else if (b.t <= 0) {
      const p = ring(Math.random() * Math.max(0, zone.r - 60), Math.random() * 6.28);
      b.tx = p.x; b.ty = p.y; b.t = 120 + rand(120);
    }
    const dx = b.tx - b.x, dy = b.ty - b.y, d = Math.hypot(dx, dy);
    if (d > 3) { const s = outside ? 1.8 : 1.2; b.ang = Math.atan2(dy, dx); b.x = bound(b.x + dx / d * s); b.y = bound(b.y + dy / d * s); }
  };
  const zoneTick = () => {
    zone.t++;
    if (zone.phase === 'hold' && zone.t > 600 && zone.k < STAGES.length) { zone.phase = 'shrink'; zone.t = 0; zone.from = zone.r; zone.to = STAGES[zone.k]; }
    else if (zone.phase === 'shrink') { zone.r = zone.from + (zone.to - zone.from) * Math.min(1, zone.t / 900); if (zone.t >= 900) { zone.phase = 'hold'; zone.t = 0; zone.k++; } }
  };
  const bulletsTick = () => {
    for (const u of bullets) {
      u.x += u.vx; u.y += u.vy; u.life--;
      if (u.who === 'p') {
        for (const b of bots) if (b.alive && Math.hypot(b.x - u.x, b.y - u.y) < 16) { b.hp -= 25; u.life = 0; if (b.hp <= 0) b.alive = false; break; }
      } else if (P.hp > 0 && Math.hypot(P.x - u.x, P.y - u.y) < 16) { P.hp -= 12; u.life = 0; }
    }
    bullets = bullets.filter(u => u.life > 0 && u.x > 0 && u.x < WORLD && u.y > 0 && u.y < WORLD);
  };
  const move = () => {
    let mx = (keys.d || keys.arrowright ? 1 : 0) - (keys.a || keys.arrowleft ? 1 : 0);
    let my = (keys.s || keys.arrowdown ? 1 : 0) - (keys.w || keys.arrowup ? 1 : 0);
    if (stick) { mx = stick.x; my = stick.y; }
    const l = Math.hypot(mx, my);
    if (l > 0.05) { P.x = bound(P.x + mx / Math.max(1, l) * 2.6); P.y = bound(P.y + my / Math.max(1, l) * 2.6); if (!aim) P.ang = Math.atan2(my, mx); }
    if (aim) P.ang = Math.atan2(aim.y - H / 2, aim.x - W / 2);
  };
  const fire = () => {
    P.cd--;
    if ((fireId !== null || keys[' ']) && P.ammo > 0 && P.cd <= 0 && P.hp > 0) { shoot(P, P.ang, 'p'); P.ammo--; P.cd = 9; }
  };
  const pickups = () => {
    items = items.filter(it => {
      if (dist(it, P) > 24) return true;
      if (it.k === 'a') P.ammo += 30; else P.hp = Math.min(100, P.hp + 35);
      return false;
    });
  };
  const zoneDamage = () => {
    const c = { x: C0, y: C0 };
    if (P.hp > 0 && dist(P, c) > zone.r) P.hp -= 0.05;
    for (const b of bots) if (b.alive && dist(b, c) > zone.r) { b.hp -= 0.05; if (b.hp <= 0) b.alive = false; }
  };
  const checkEnd = () => {
    if (P.hp <= 0) { P.hp = 0; state = 'lost'; }
    else if (!bots.some(b => b.alive)) state = 'won';
    if (state !== 'play') $('bG').textContent = 'Play again';
  };
  const tank = (x, y, c, ang) => {
    ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, y, 14, 0, 6.2832); ctx.fill();
    ctx.strokeStyle = '#1d1b3a'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + Math.cos(ang) * 22, y + Math.sin(ang) * 22); ctx.stroke();
  };
  const draw = () => {
    const cx = P.x - W / 2, cy = P.y - H / 2;
    ctx.fillStyle = '#5a1e2a'; ctx.fillRect(0, 0, W, H);
    ctx.save(); ctx.beginPath(); ctx.arc(C0 - cx, C0 - cy, zone.r, 0, 6.2832); ctx.clip();
    ctx.fillStyle = '#3f8f47'; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = 'rgba(0,0,0,.14)'; ctx.lineWidth = 2;
    for (let x = ((-cx % 60) + 60) % 60; x < W; x += 60) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
    for (let y = ((-cy % 60) + 60) % 60; y < H; y += 60) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
    ctx.restore();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(C0 - cx, C0 - cy, zone.r, 0, 6.2832); ctx.stroke();
    ctx.textAlign = 'center';
    for (const it of items) {
      const x = it.x - cx, y = it.y - cy;
      if (x < -12 || x > W + 12 || y < -12 || y > H + 12) continue;
      ctx.fillStyle = it.k === 'a' ? '#ffd23f' : '#ff5d73'; ctx.beginPath(); ctx.arc(x, y, 9, 0, 6.2832); ctx.fill();
      ctx.fillStyle = '#1d1b3a'; ctx.font = '800 12px system-ui, sans-serif'; ctx.fillText(it.k === 'a' ? 'A' : '+', x, y + 4);
    }
    for (const b of bots) {
      if (!b.alive) continue;
      const x = b.x - cx, y = b.y - cy;
      if (x < -30 || x > W + 30 || y < -30 || y > H + 30) continue;
      tank(x, y, '#2e9bff', b.ang);
      ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillRect(x - 14, y - 22, 28, 5);
      ctx.fillStyle = '#43e97b'; ctx.fillRect(x - 14, y - 22, 28 * Math.max(0, b.hp) / 100, 5);
    }
    ctx.fillStyle = '#fff3a0';
    for (const u of bullets) { ctx.beginPath(); ctx.arc(u.x - cx, u.y - cy, 3, 0, 6.2832); ctx.fill(); }
    if (P.hp > 0) tank(W / 2, H / 2, '#ffb70a', P.ang);
    $('bA').textContent = (P.hp > 0 ? 1 : 0) + bots.filter(b => b.alive).length;
    $('bM').textContent = P.ammo;
    $('bH').textContent = Math.ceil(P.hp);
    if (state !== 'play') {
      const [h, s] = { won: ['Last one standing!', 'You outlasted every rival'], lost: ['Eliminated', 'Press Restart to drop in again'] }[state];
      ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillRect(0, 150, W, 110);
      ctx.fillStyle = '#fff'; ctx.font = '800 24px system-ui, sans-serif'; ctx.fillText(h, W / 2, 190);
      ctx.font = '600 15px system-ui, sans-serif'; ctx.fillText(s, W / 2, 220);
    }
  };
  const drawIdle = () => {
    ctx.fillStyle = '#3f8f47'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center';
    ctx.font = '800 26px system-ui, sans-serif'; ctx.fillText('Ready to drop in?', W / 2, H / 2);
    ctx.font = '600 15px system-ui, sans-serif'; ctx.fillText('Press Drop in above', W / 2, H / 2 + 30);
  };
  const loop = () => {
    if (state === 'play') { move(); fire(); bots.forEach(think); zoneTick(); bulletsTick(); pickups(); zoneDamage(); checkEnd(); }
    if (state === 'idle') drawIdle(); else draw();
    raf = requestAnimationFrame(loop);
  };
  const kd = e => {
    if (e.target && e.target.tagName === 'INPUT') return;
    const k = e.key.toLowerCase();
    if (['w', 'a', 's', 'd', ' ', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(k)) { e.preventDefault(); keys[k] = true; }
  };
  const ku = e => { keys[e.key.toLowerCase()] = false; };
  const at = e => { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * (W / r.width), y: (e.clientY - r.top) * (H / r.height) }; };
  cv.addEventListener('pointerdown', e => {
    if (state !== 'play') return;
    const p = at(e);
    cv.setPointerCapture(e.pointerId);
    if (e.pointerType !== 'mouse' && p.x < W / 2) stick = { id: e.pointerId, ox: p.x, oy: p.y, x: 0, y: 0 };
    else { fireId = e.pointerId; aim = p; }
  });
  cv.addEventListener('pointermove', e => {
    const p = at(e);
    if (stick && e.pointerId === stick.id) { const dx = p.x - stick.ox, dy = p.y - stick.oy, l = Math.hypot(dx, dy) || 1, k = Math.min(l, 40) / l; stick.x = dx * k / 40; stick.y = dy * k / 40; }
    else if (e.pointerType === 'mouse' || e.pointerId === fireId) aim = p;
  });
  const release = e => { if (stick && e.pointerId === stick.id) stick = null; if (e.pointerId === fireId) fireId = null; };
  cv.addEventListener('pointerup', release);
  cv.addEventListener('pointercancel', release);
  document.addEventListener('keydown', kd);
  document.addEventListener('keyup', ku);
  $('bG').onclick = () => drop();
  loop();
  return () => { cancelAnimationFrame(raf); document.removeEventListener('keydown', kd); document.removeEventListener('keyup', ku); };
}

function stormCircle() {
  app.innerHTML = `
  <div class='panel'>
    <div class='hud'><span>Alive <b id='bA'>10</b></span><span>Hp <b id='bH'>100</b></span><span id='bG'>Pistol</span><button class='btn' id='bS'>Drop in</button></div>
    <canvas id='bC' class='cv' width='340' height='460' aria-label='Storm Circle battle'></canvas>
    <div class='pad'><button id='bF' style='width:140px;height:60px;font-weight:800' aria-label='Fire'>FIRE</button></div>
    <p class='hint'>PC: WASD to move, mouse to aim, click or hold Space to fire. Phone: drag on the map to move, hold FIRE to shoot. Stay inside the storm.</p>
  </div>`;
  const cv = $('bC'), ctx = cv.getContext('2d');
  const W = 340, H = 460, MAP = 1200;
  const GUN = { pistol: { dmg: 12, rate: 24, spread: 0.05, name: 'Pistol' }, rifle: { dmg: 16, rate: 9, spread: 0.09, name: 'Rifle' } };
  const COL = ['#ff8c42', '#7c6cff', '#2e9e4f', '#0ea5e9', '#e0a800', '#f093fb', '#43e97b', '#fa709a', '#2ec4b6'];
  const keys = {}, stick = { on: false, x: 0, y: 0, ox: 0, oy: 0 };
  let me, bots, bullets, loot, walls, frameN, state = 'ready', endInfo = null, mouseAim = null, firing = false, zoneR = 820, raf;
  const rnd = (a, b) => a + Math.random() * (b - a);
  const hyp = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
  const inWall = (x, y, r = 12) => walls.some(w => x + r > w.x && x - r < w.x + w.w && y + r > w.y && y - r < w.y + w.h);
  const moveBody = (o, dx, dy) => {
    if (!inWall(o.x + dx, o.y)) o.x += dx;
    if (!inWall(o.x, o.y + dy)) o.y += dy;
    o.x = Math.max(12, Math.min(MAP - 12, o.x));
    o.y = Math.max(12, Math.min(MAP - 12, o.y));
  };
  const freeSpot = () => { let x, y; do { x = rnd(60, MAP - 60); y = rnd(60, MAP - 60); } while (inWall(x, y, 20)); return { x, y }; };
  const newLoot = () => { const p = freeSpot(), r = Math.random(); return { ...p, k: r < 0.35 ? 'rifle' : r < 0.7 ? 'medkit' : 'ammo' }; };
  const newActor = (p, extra) => ({ x: p.x, y: p.y, hp: 100, gun: 'pistol', ammo: 0, face: 0, cd: 0, alive: true, t: 0, tx: p.x, ty: p.y, ...extra });
  const nearest = (a, r) => bots.filter(b => b.alive && hyp(a, b) < r).sort((p, q) => hyp(a, p) - hyp(a, q))[0];
  const pickUp = a => {
    loot = loot.filter(l => {
      if (hyp(l, a) > 24) return true;
      if (l.k === 'medkit') a.hp = Math.min(100, a.hp + 40);
      else if (l.k === 'rifle' || a.gun === 'rifle') { a.gun = 'rifle'; a.ammo = Math.min(60, a.ammo + 30); }
      else return true;
      return false;
    });
  };
  const fire = (a, ang, extra = 0) => {
    const g = GUN[a.gun], s = ang + rnd(-g.spread - extra, g.spread + extra);
    bullets.push({ x: a.x, y: a.y, vx: Math.cos(s) * 13, vy: Math.sin(s) * 13, dmg: a === me ? g.dmg : g.dmg * 0.55, by: a, life: 70 });
    a.cd = g.rate;
    if (a.gun === 'rifle' && --a.ammo <= 0) a.gun = 'pistol';
  };
  const hurt = (t, dmg, by) => {
    if (!t.alive) return;
    t.hp -= dmg;
    if (t.hp <= 0) {
      t.alive = false;
      if (by === me) me.kills++;
      loot.push({ x: t.x, y: t.y, k: t.gun === 'rifle' ? 'rifle' : 'medkit' });
    }
  };
  const finish = win => {
    state = win ? 'won' : 'lost';
    endInfo = { place: bots.filter(b => b.alive).length + (me.alive ? 1 : 2), kills: me.kills };
    $('bS').textContent = 'Play again';
  };
  const setup = () => {
    walls = Array.from({ length: 22 }, () => ({ x: rnd(40, MAP - 180), y: rnd(40, MAP - 180), w: rnd(60, 150), h: rnd(50, 120) })).filter(w => Math.hypot(w.x - MAP / 2, w.y - MAP / 2) > 140);
    loot = Array.from({ length: 80 }, () => newLoot());
    me = newActor(freeSpot(), { kills: 0 });
    bots = COL.map(c => newActor(freeSpot(), { c, face: rnd(0, 6.28) }));
    bullets = []; frameN = 0; zoneR = 820; mouseAim = null; endInfo = null;
  };
  const tick = () => {
    if (state !== 'play') return;
    frameN++;
    zoneR = Math.max(60, 820 - frameN / 60 * 6.5);
    let mx = 0, my = 0;
    if (stick.on) { mx = stick.x; my = stick.y; }
    else {
      mx = (keys.R ? 1 : 0) - (keys.L ? 1 : 0);
      my = (keys.D ? 1 : 0) - (keys.U ? 1 : 0);
      const L = Math.hypot(mx, my) || 1;
      mx /= L; my /= L;
    }

      camera.lookAt(me.x + fx * 6, 1.5, me.z + fz * 6);
      camera.fov = 60 + Math.min(14, sp * 0.3);
      camera.updateProjectionMatrix();
      sun.position.set(me.x + 40, 90, me.z + 30);
      sun.target.position.set(me.x, 0, me.z);
      hud();
      renderer.render(scene, camera);
      raf = requestAnimationFrame(loop);
    };
    const KEY = { ArrowUp: 'U', w: 'U', W: 'U', ArrowDown: 'B', s: 'B', S: 'B', ' ': 'B', ArrowLeft: 'L', a: 'L', A: 'L', ArrowRight: 'R', d: 'R', D: 'R' };
    const onDown = e => { const k = KEY[e.key]; if (!k || (e.target && e.target.tagName === 'INPUT')) return; e.preventDefault(); keys[k] = true; };
    const onUp = e => { const k = KEY[e.key]; if (k) keys[k] = false; };
    document.addEventListener('keydown', onDown);
    document.addEventListener('keyup', onUp);
    const hold = (id, k) => {
      const b = $(id);
      b.addEventListener('pointerdown', e => { e.preventDefault(); pad[k] = true; });
      const up = () => { pad[k] = false; };
      b.addEventListener('pointerup', up);
      b.addEventListener('pointerleave', up);
      b.addEventListener('pointercancel', up);
    };
    hold('dl', 'l'); hold('dr', 'r'); hold('dg', 'g'); hold('db', 'b');
    $('dgo').onclick = e => { reset(); state = 'play'; $('dgo').style.display = 'none'; $('dm').textContent = 'Go!'; e.currentTarget.blur(); };
    reset();
    placeBots();
    if (online) lobby('drive', t => { $('dm').textContent = t; }, r => {
      room = r;
      off = room.onPeers(() => {});
      reset();
      state = 'wait';
      $('dm').textContent = 'Waiting for a friend to join...';
    });
    raf = requestAnimationFrame(loop);
    return () => {
      cancelAnimationFrame(raf);
      off();
      document.removeEventListener('keydown', onDown);
      document.removeEventListener('keyup', onUp);
      if (room) room.leave();
      renderer.dispose();
    };
  };
}

function reactionDuel() {

function pong2() {
  return () => {
    app.innerHTML = `
    <div class='panel'>
      <div class='hud'><span>P1 <b id='pa'>0</b></span><span>P2 <b id='pb'>0</b></span><button class='btn' id='pg'>Start</button></div>
      <canvas id='pcv' class='cv' width='320' height='420' aria-label='Pong for two players'></canvas>
      <p class='hint'>P1: W and S, or drag on the left half. P2: Up and Down arrows, or drag on the right half. First to 5 wins.</p>
    </div>`;
    const cv = $('pcv'), ctx = cv.getContext('2d');
    const W = 320, H = 420, PH = 70, R = 6;
    const cl = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
    const keys = {};
    let y = [175, 175], bx = W / 2, by = H / 2, dx = 3, dy = 0, sc = [0, 0], state = 'ready', raf;
    const serve = d => { bx = W / 2; by = H / 2; dx = 3 * d; dy = (Math.random() * 2 - 1) * 2.5; };
    const reset = () => { y = [175, 175]; sc = [0, 0]; state = 'ready'; $('pa').textContent = 0; $('pb').textContent = 0; serve(1); };
    const point = p => {
      sc[p]++;
      $('pa').textContent = sc[0];
      $('pb').textContent = sc[1];
      serve(p === 0 ? 1 : -1);
      if (sc[p] >= 5) { state = 'over'; $('pg').textContent = 'Play again'; }
    };
    function step() {
      if (state !== 'play') return;
      if (keys.w) y[0] -= 5;
      if (keys.s) y[0] += 5;
      if (keys.ArrowUp) y[1] -= 5;
      if (keys.ArrowDown) y[1] += 5;
      y = y.map(v => cl(v, 0, H - PH));
      bx += dx; by += dy;
      if (by < R || by > H - R) { dy = -dy; by = cl(by, R, H - R); }
      if (dx < 0 && bx - R <= 18 && bx + R >= 10 && by >= y[0] - R && by <= y[0] + PH + R) {
        dx = Math.min(7, -dx * 1.05); bx = 18 + R; dy = cl(dy + (by - y[0] - PH / 2) / (PH / 2) * 2, -6, 6);
      }
      if (dx > 0 && bx + R >= W - 18 && bx - R <= W - 10 && by >= y[1] - R && by <= y[1] + PH + R) {
        dx = Math.max(-7, -dx * 1.05); bx = W - 18 - R; dy = cl(dy + (by - y[1] - PH / 2) / (PH / 2) * 2, -6, 6);
      }
      if (bx < -R) point(1); else if (bx > W + R) point(0);
    }
    function draw() {
      ctx.fillStyle = '#1d1b3a';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = 'rgba(246,243,255,.25)';
      ctx.fillRect(W / 2 - 1, 0, 2, H);
      ctx.fillStyle = '#2ec4b6';
      ctx.fillRect(10, y[0], 8, PH);
      ctx.fillStyle = '#ff8fa3';
      ctx.fillRect(W - 18, y[1], 8, PH);
      ctx.fillStyle = '#ffb70a';
      ctx.beginPath();
      ctx.arc(bx, by, R, 0, Math.PI * 2);
      ctx.fill();
      if (state !== 'play') {
        ctx.fillStyle = '#fff';
        ctx.textAlign = 'center';
        ctx.font = '800 24px system-ui, sans-serif';
        ctx.fillText(state === 'over' ? (sc[0] > sc[1] ? 'Player 1 wins!' : 'Player 2 wins!') : 'Ready?', W / 2, H / 2 - 40);
        ctx.font = '600 16px system-ui, sans-serif';
        ctx.fillText(state === 'over' ? 'Press Play again' : 'Press Start to serve', W / 2, H / 2 - 10);
      }
    }
    function loop() { step(); draw(); raf = requestAnimationFrame(loop); }
    const drag = e => {
      if (e.pointerType === 'mouse' && !e.buttons) return;
      const r = cv.getBoundingClientRect();
      const side = (e.clientX - r.left) / r.width < 0.5 ? 0 : 1;
      y[side] = cl((e.clientY - r.top) * (H / r.height) - PH / 2, 0, H - PH);
    };
    const down = e => { keys[e.key.length === 1 ? e.key.toLowerCase() : e.key] = true; if (e.key.startsWith('Arrow')) e.preventDefault(); };
    const up = e => { keys[e.key.length === 1 ? e.key.toLowerCase() : e.key] = false; };
    cv.addEventListener('pointermove', drag);
    cv.addEventListener('pointerdown', drag);
    document.addEventListener('keydown', down);
    document.addEventListener('keyup', up);
    $('pg').onclick = () => { reset(); state = 'play'; $('pg').textContent = 'Restart'; $('pg').blur(); };
    reset();
    loop();
    return () => { cancelAnimationFrame(raf); document.removeEventListener('keydown', down); document.removeEventListener('keyup', up); };
  };
}

      $('gs').textContent = `P1 ${sc[0]} · P2 ${sc[1]}`;

function memDuel() {
  return () => {
    const pool = [...'🐶🐱🐭🐰🦊🐻🐼🐨'];
    app.innerHTML = `
    <div class='panel'>
      <div class='hud'><span id='ms'></span><button class='btn' id='mg'>New game</button></div>
      <div class='board' id='mb'></div>
      <p class='hint' id='mh'></p>
    </div>`;
    let deck, open, sc, p, busy, left;
    const upd = () => {
      $('ms').textContent = `P1 ${sc[0]} · P2 ${sc[1]}`;
      $('mh').textContent = left ? `Player ${p + 1}'s turn. A match earns another turn.` : sc[0] === sc[1] ? "It's a tie!" : `Player ${sc[0] > sc[1] ? 1 : 2} wins!`;
    };
    const deal = () => {
      deck = shuffle([...pool, ...pool]);
      open = []; sc = [0, 0]; p = 0; busy = false; left = 8;
      $('mb').innerHTML = deck.map((_, i) => `<button class='tile' data-i='${i}'>?</button>`).join('');
      upd();
    };
    $('mb').onclick = e => {
      const t = e.target.closest('.tile');
      if (!t || busy || t.classList.contains('up') || t.classList.contains('done')) return;
      t.classList.add('up');
      t.textContent = deck[t.dataset.i];
      open.push(t);
      if (open.length < 2) return;
      busy = true;
      const [a, b] = open;
      if (deck[a.dataset.i] === deck[b.dataset.i]) {
        a.classList.add('done'); b.classList.add('done');
        sc[p]++; left--; open = []; busy = false;
        upd();
      } else {
        setTimeout(() => {
          [a, b].forEach(x => { x.classList.remove('up'); x.textContent = '?'; });
          open = []; busy = false; p = 1 - p;
          upd();
        }, 800);
      }
    };
    $('mg').onclick = deal;
    deal();
    return () => {};
  };
}

};

    store.set('pa-recent', [g.id, ...store.get('pa-recent', []).filter(x => x !== g.id)].slice(0, 8));
    const fav = store.get('pa-favs', []).includes(g.id);
    app.insertAdjacentHTML('afterbegin', `<div class='gh'><div class='ghr'><a class='back' href='#'>← All games</a><span><button class='ico' id='fv' aria-label='Favorite'>${fav ? '❤️' : '🤍'}</button>${document.fullscreenEnabled ? `<button class='ico' id='fs' aria-label='Fullscreen'>⛶</button>` : ''}</span></div><h1 class='gt'>${logo(g)} ${g.name}</h1></div>`);
    $('fv').onclick = () => {
      const f = store.get('pa-favs', []), on = !f.includes(g.id);
      store.set('pa-favs', on ? [g.id, ...f] : f.filter(x => x !== g.id));
      $('fv').textContent = on ? '❤️' : '🤍';
    };
    if ($('fs')) $('fs').onclick = () => { const p = document.querySelector('.panel'); if (p && p.requestFullscreen) Promise.resolve(p.requestFullscreen()).catch(() => {}); };
    const more = shuffle(CATALOG.filter(x => x.cat === g.cat && x.id !== g.id)).slice(0, 8).map(x => x.id);
    app.insertAdjacentHTML('beforeend', `<div class='more'>${rowHtml('More ' + g.cat + ' games', more)}</div>`);
  } else {
    renderHome();
    stop = () => {};
  }
  window.scrollTo(0, 0);
}
addEventListener('hashchange', route);
route();
</script>
</body>
</html>
