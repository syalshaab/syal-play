<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --bg: #fff8ec;
  --ink: #1d1b3a;
  --muted: #5f5a7a;
  --card: #ffffff;
  --line: #e8dfcc;
  --accent: #ff5d73;
  --accent-2: #ffb70a;
  --accent-3: #2ec4b6;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161432; --ink: #f6f3ff; --muted: #aca6cc; --card: #221f47; --line: #34305e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161432; --ink: #f6f3ff; --muted: #aca6cc; --card: #221f47; --line: #34305e;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--ink);
  font-family: "Baloo 2", system-ui, sans-serif;
  font-size: 17px;
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  background: var(--bg);
  z-index: 10;
}
header {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 5;
  background: var(--bg);
  border-bottom: 2px solid var(--line);
  padding: 14px 20px;
}
.brand { font-size: 1.6rem; font-weight: 800; color: var(--ink); text-decoration: none; }
.brand span { color: var(--accent); }
main { max-width: 960px; margin: 0 auto; padding: 28px 20px 56px; }
h1 { font-size: clamp(2.2rem, 7vw, 3.8rem); line-height: 1; margin: 0 0 12px; font-weight: 800; }
.intro p { margin: 0; color: var(--muted); font-size: 1.2rem; max-width: 34ch; }
.games {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 20px;
  margin-top: 32px;
}
.game {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  min-height: 220px;
  padding: 24px;
  border-radius: 24px;
  color: #1d1b3a;
  text-decoration: none;
}
.game h2 { margin: 8px 0 4px; font-size: 1.7rem; font-weight: 800; }
.game p { margin: 0; font-size: 1.05rem; }
.icon { font-size: 4rem; line-height: 1; }
.g1 { background: var(--accent-2); }
.g2 { background: var(--accent-3); }
.panel {
  max-width: 440px;
  margin: 0 auto;
  padding: 20px;
  background: var(--card);
  border: 2px solid var(--line);
  border-radius: 24px;
}
.hud { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; font-size: 1.2rem; }
.btn {
  font: inherit;
  font-weight: 800;
  padding: 10px 16px;
  border: 0;
  border-radius: 12px;
  background: var(--ink);
  color: var(--bg);
  cursor: pointer;
}
#cv {
  display: block;
  width: 100%;
  max-width: 320px;
  height: auto;
  margin: 0 auto;
  border-radius: 14px;
  touch-action: none;
}
.pad { display: flex; justify-content: center; gap: 10px; margin-top: 16px; }
.pad button {
  width: 60px;
  height: 56px;
  font: inherit;
  font-size: 1.4rem;
  border-radius: 16px;
  border: 2px solid var(--line);
  background: var(--bg);
  color: var(--ink);
  cursor: pointer;
}
.hint { margin: 14px 0 0; text-align: center; color: var(--muted); font-size: .95rem; }
.board { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.tile {
  aspect-ratio: 1;
  border: 0;
  border-radius: 14px;
  background: var(--accent-2);
  color: var(--ink);
  font: inherit;
  font-size: 1.8rem;
  font-weight: 800;
  cursor: pointer;
  display: grid;
  place-items: center;
}
.tile.up { background: var(--bg); border: 2px solid var(--line); }
.tile.done { background: var(--accent-3); }
.cv { display: block; width: 100%; max-width: 320px; height: auto; margin: 0 auto; border-radius: 14px; touch-action: none; }
.board3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.hole { aspect-ratio: 1; border: 0; border-radius: 50%; background: var(--line); font-size: 2.4rem; cursor: pointer; display: grid; place-items: center; touch-action: manipulation; }
.hole.up { background: var(--accent-2); }
.g3 { background: var(--accent); }
.g4 { background: #c7b8ff; }
.g5 { background: #ffd6a5; }
.g6 { background: #b8f2e6; }
.g7 { background: #ffb3c1; }
.g8 { background: #d4f1ff; }
.g9 { background: #ffd08a; }
.g10 { background: #c9f2c7; }
.g11 { background: #ffe8a3; }
.board2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.pad4 { aspect-ratio: 1; border: 0; border-radius: 20px; opacity: .4; cursor: pointer; touch-action: manipulation; }
.pad4.lit { opacity: 1; }
.board4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; touch-action: none; }
.tile2 { aspect-ratio: 1; border-radius: 12px; display: grid; place-items: center; font-size: 1.6rem; font-weight: 800; color: #1d1b3a; }
.board7 { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; padding: 8px; background: var(--line); border-radius: 16px; }
.slot { aspect-ratio: 1; border: 0; border-radius: 50%; background: var(--bg); cursor: pointer; touch-action: manipulation; }
.slot.red { background: #ff5d73; }
.slot.yel { background: #ffb70a; }
.react { display: block; width: 100%; aspect-ratio: 1.6; border: 0; border-radius: 22px; background: #fff8ec; color: #1d1b3a; font: inherit; font-size: 1.5rem; font-weight: 800; cursor: pointer; touch-action: manipulation; }
.react.wait { background: #ff5d73; }
.react.go { background: #2ec4b6; }
.react.early { background: #ffb70a; }
.g12 { background: #ffcad4; }
.g13 { background: #cdb4ff; }
.g14 { background: #a8e6cf; }
.g15 { background: #ffe29a; }
.g16 { background: #9ad0f5; }
.g17 { background: #ffb4a2; }
.g18 { background: #fff1a8; }
.g19 { background: #f9c6ff; }
.g20 { background: #ffc9de; }
.mines { display: grid; grid-template-columns: repeat(9, 1fr); gap: 3px; }
.mc { aspect-ratio: 1; padding: 0; border: 0; border-radius: 6px; background: var(--accent-2); color: #1d1b3a; font: inherit; font-weight: 800; cursor: pointer; touch-action: manipulation; }
.mc.open { background: var(--line); color: var(--ink); }
.mc.boom { background: var(--accent); }
.wg { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 6px; }
.wl { aspect-ratio: 1; display: grid; place-items: center; border: 2px solid var(--line); border-radius: 10px; font-size: 1.6rem; font-weight: 800; text-transform: uppercase; }

.big { margin: 8px 0 14px; text-align: center; font-size: 2rem; font-weight: 800; min-height: 2.4rem; }
.cell.empty { background: transparent; cursor: default; }
.board5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.lamp { aspect-ratio: 1; border: 0; border-radius: 12px; background: var(--line); cursor: pointer; touch-action: manipulation; }

.cell { aspect-ratio: 1; border: 0; border-radius: 14px; background: var(--line); color: var(--ink); font: inherit; font-size: 2.6rem; font-weight: 800; cursor: pointer; touch-action: manipulation; }

.icon { font-size: 2.6rem; }

.c4 { background: #ffd6a5; } .c5 { background: #b8f2e6; } .c6 { background: #ffb3c1; } .c7 { background: #d4f1ff; }

<script>
const app = document.getElementById('app');
// Keep game loops near 60 updates per second on 90, 120, and 144 Hz screens.
const nativeRaf = window.requestAnimationFrame.bind(window);
const nativeCaf = window.cancelAnimationFrame.bind(window);
const pending = {};
let nextId = 0;
const lastRun = new WeakMap();
window.requestAnimationFrame = cb => {
  const id = ++nextId;
  const go = t => {
    if (t - (lastRun.get(cb) || 0) < 13) { pending[id] = nativeRaf(go); return; }
    delete pending[id];
    lastRun.set(cb, t);
    cb(t);
  };
  pending[id] = nativeRaf(go);
  return id;
};
window.cancelAnimationFrame = id => {
  if (id in pending) { nativeCaf(pending[id]); delete pending[id]; }
};
let stop = () => {};
const rand = n => Math.floor(Math.random() * n);

function snake() {
  app.innerHTML = `
  <div class="panel">
    <div class="hud"><span>Score <b id="sc">0</b></span><button class="btn" id="again">Restart</button></div>
    <canvas id="cv" width="320" height="320" aria-label="Snake game board"></canvas>
    <div class="pad">
      <button data-x="0" data-y="-1" aria-label="Up">▲</button>
      <button data-x="-1" data-y="0" aria-label="Left">◀</button>
      <button data-x="1" data-y="0" aria-label="Right">▶</button>
      <button data-x="0" data-y="1" aria-label="Down">▼</button>
    </div>
    <p class="hint">Arrow keys or WASD, swipe on the board, or tap the buttons.</p>
  </div>`;

  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const N = 16, S = 20;
  let body, dir, next, food, score, timer, over;
  const same = (a, b) => a.x === b.x && a.y === b.y;

  function place() {
    do { food = { x: rand(N), y: rand(N) }; } while (body.some(p => same(p, food)));
  }
  function draw() {
    ctx.fillStyle = '#1d1b3a';
    ctx.fillRect(0, 0, 320, 320);
    ctx.fillStyle = '#ff5d73';
    ctx.fillRect(food.x * S + 3, food.y * S + 3, S - 6, S - 6);
    body.forEach((p, i) => {
      ctx.fillStyle = i ? '#2ec4b6' : '#ffb70a';
      ctx.fillRect(p.x * S + 1, p.y * S + 1, S - 2, S - 2);
    });
    if (over) {
      ctx.fillStyle = 'rgba(0,0,0,.55)';
      ctx.fillRect(0, 0, 320, 320);
      ctx.fillStyle = '#fff';
      ctx.textAlign = 'center';
      ctx.font = '800 26px system-ui, sans-serif';
      ctx.fillText('Game over', 160, 150);
      ctx.font = '600 16px system-ui, sans-serif';
      ctx.fillText('Press Restart to play again', 160, 180);
    }
  }
  function end() { over = true; clearInterval(timer); draw(); }
  function tick() {
    dir = next;
    const head = { x: body[0].x + dir.x, y: body[0].y + dir.y };
    const hitWall = head.x < 0 || head.y < 0 || head.x >= N || head.y >= N;
    if (hitWall || body.some(p => same(p, head))) return end();
    body.unshift(head);
    if (same(head, food)) {
      score++;
      document.getElementById('sc').textContent = score;
      place();
    } else {
      body.pop();
    }
    draw();
  }
  function restart() {
    body = [{ x: 8, y: 8 }, { x: 7, y: 8 }, { x: 6, y: 8 }];
    dir = next = { x: 1, y: 0 };
    score = 0;
    over = false;
    document.getElementById('sc').textContent = 0;
    place();
    draw();
    clearInterval(timer);
    timer = setInterval(tick, 120);
  }
  function turn(x, y) {
    if (x === -dir.x && y === -dir.y) return; // no instant reversal
    next = { x, y };
  }

  const keys = {
    ArrowUp: [0, -1], w: [0, -1], W: [0, -1],
    ArrowDown: [0, 1], s: [0, 1], S: [0, 1],
    ArrowLeft: [-1, 0], a: [-1, 0], A: [-1, 0],
    ArrowRight: [1, 0], d: [1, 0], D: [1, 0]
  };
  function onKey(e) {
    const k = keys[e.key];
    if (k) { e.preventDefault(); turn(...k); }
  }
  document.addEventListener('keydown', onKey);

  app.querySelectorAll('.pad button').forEach(b => {
    b.onclick = () => turn(+b.dataset.x, +b.dataset.y);
  });
  document.getElementById('again').onclick = restart;

  let sx = 0, sy = 0;
  cv.addEventListener('touchstart', e => {
    sx = e.touches[0].clientX; sy = e.touches[0].clientY;
  }, { passive: true });
  cv.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - sx;
    const dy = e.changedTouches[0].clientY - sy;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
    if (Math.abs(dx) > Math.abs(dy)) turn(Math.sign(dx), 0);
    else turn(0, Math.sign(dy));
  });

  restart();
  return () => {
    clearInterval(timer);
    document.removeEventListener('keydown', onKey);
  };
}

function memory(set) {
  const icons = set || ['🍎', '🚀', '🎈', '🐸', '⭐', '🍩', '🎯', '🌵'];
  app.innerHTML = `
  <div class="panel">
    <div class="hud"><span>Moves <b id="mv">0</b></span><button class="btn" id="shuffle">New game</button></div>
    <div class="board" id="board"></div>
    <p class="hint" id="msg">Find all eight pairs.</p>
  </div>`;

  const board = document.getElementById('board');
  const mvEl = document.getElementById('mv');
  const msgEl = document.getElementById('msg');
  let deck, opened, matched, moves, busy;

  function show(t) {
    t.classList.add('up');
    t.firstElementChild.textContent = deck[t.dataset.i];
  }
  function hide(t) {
    t.classList.remove('up');
    t.firstElementChild.textContent = '?';
  }
  function deal() {
    deck = [...icons, ...icons].sort(() => Math.random() - 0.5);
    opened = []; matched = 0; moves = 0; busy = false;
    mvEl.textContent = 0;
    msgEl.textContent = 'Find all eight pairs.';
    board.innerHTML = deck.map((_, i) =>
      `<button class="tile" data-i="${i}" aria-label="Hidden card ${i + 1}"><span>?</span></button>`
    ).join('');
  }

  board.onclick = e => {
    const t = e.target.closest('.tile');
    if (!t || busy || t.classList.contains('up') || t.classList.contains('done')) return;
    show(t);
    opened.push(t);
    if (opened.length === 2) {
      moves++;
      mvEl.textContent = moves;
      busy = true;
      const [a, b] = opened;
      if (deck[a.dataset.i] === deck[b.dataset.i]) {
        a.classList.add('done');
        b.classList.add('done');
        matched++;
        opened = [];
        busy = false;
        if (matched === icons.length) msgEl.textContent = `Solved in ${moves} moves!`;
      } else {
        setTimeout(() => {
          hide(a); hide(b);
          opened = [];
          busy = false;
        }, 700);
      }
    }
  };

  document.getElementById('shuffle').onclick = deal;
  deal();
  return () => {};
}

function whack(emoji, ms) {
  app.innerHTML = `
  <div class="panel">

    <div class="board3" id="holes"></div>

  </div>`;
  const holes = document.getElementById('holes');
  const wsc = document.getElementById('wsc');
  const wt = document.getElementById('wt');
  const wgo = document.getElementById('wgo');
  const wmsg = document.getElementById('wmsg');
  holes.innerHTML = Array.from({ length: 9 }, (_, i) =>
    `<button class="hole" data-i="${i}" aria-label="Hole ${i + 1}"></button>`).join('');
  let score = 0, time = 30, up = -1, running = false, clock, moles;
  const setMole = (i, on) => {
    holes.children[i].classList.toggle('up', on);
    holes.children[i].textContent = on ? (emoji || '🐹') : '';
  };
  function pop() {
    if (up >= 0) setMole(up, false);
    up = rand(9);
    setMole(up, true);
  }
  function finish() {
    running = false;
    clearInterval(clock);
    clearInterval(moles);
    if (up >= 0) setMole(up, false);
    up = -1;
    wgo.textContent = 'Play again';
    wmsg.textContent = `Time's up! You scored ${score}.`;
  }
  wgo.onclick = () => {
    score = 0; time = 30; running = true;

    wt.textContent = time;
    wgo.textContent = 'Restart';
    wmsg.textContent = 'Tap or click the moles before they hide.';
    clearInterval(clock);
    clearInterval(moles);
    pop();
    moles = setInterval(pop, ms || 800);
    clock = setInterval(() => {
      wt.textContent = --time;
      if (time <= 0) finish();
    }, 1000);
    wgo.blur();
  };
  holes.onclick = e => {
    const h = e.target.closest('.hole');

}

function glide() {
  app.innerHTML = `
  <div class="panel">
    <div class="hud"><span>Score <b id="gsc">0</b></span><button class="btn" id="ggo">Start</button></div>
    <canvas id="gcv" class="cv" width="320" height="480" aria-label="Glide game board"></canvas>
    <p class="hint">Press Space, tap, or click to flap. Fly through the gaps.</p>
  </div>`;
  const cv = document.getElementById('gcv');
  const ctx = cv.getContext('2d');
  const gsc = document.getElementById('gsc');
  const ggo = document.getElementById('ggo');
  const W = 320, H = 480, GAP = 140, PW = 52, BX = 80, BR = 12;
  let y, vy, walls, score, state, raf;
  function reset() {
    y = H / 2; vy = 0; walls = []; score = 0; state = 'ready';
    gsc.textContent = 0;
  }
  function flap() {
    if (state === 'over') return;
    state = 'play';
    vy = -7;
  }
  function die() {
    state = 'over';
    ggo.textContent = 'Try again';
  }
  function step() {
    vy += 0.45;
    y += vy;
    if (y - BR < 0 || y + BR > H) return die();
    walls.forEach(w => { w.x -= 2.6; });
    if (!walls.length || walls[walls.length - 1].x < W - 170) {
      walls.push({ x: W, top: 50 + rand(H - GAP - 100), passed: false });
    }
    walls = walls.filter(w => w.x > -PW);
    for (const w of walls) {
      if (!w.passed && w.x + PW < BX - BR) { w.passed = true; gsc.textContent = ++score; }
      if (BX + BR > w.x && BX - BR < w.x + PW && (y - BR < w.top || y + BR > w.top + GAP)) return die();
    }
  }
  function draw() {
    ctx.fillStyle = '#1d1b3a';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#2ec4b6';
    for (const w of walls) {
      ctx.fillRect(w.x, 0, PW, w.top);
      ctx.fillRect(w.x, w.top + GAP, PW, H - w.top - GAP);
    }
    ctx.fillStyle = '#ffb70a';
    ctx.beginPath();
    ctx.arc(BX, y, BR, 0, Math.PI * 2);
    ctx.fill();
    if (state !== 'play') {
      ctx.fillStyle = '#fff';
      ctx.textAlign = 'center';
      ctx.font = '800 26px system-ui, sans-serif';
      ctx.fillText(state === 'over' ? 'Crash!' : 'Ready?', W / 2, H / 2 - 40);
      ctx.font = '600 16px system-ui, sans-serif';
      ctx.fillText(state === 'over' ? `Score ${score}. Press Try again.` : 'Tap or press Space to start', W / 2, H / 2 - 10);
    }
  }
  function loop() {
    if (state === 'play') step();
    draw();
    raf = requestAnimationFrame(loop);
  }
  const onKey = e => {
    if (e.code === 'Space' || e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') {
      e.preventDefault();
      flap();
    }
  };
  document.addEventListener('keydown', onKey);
  cv.addEventListener('pointerdown', flap);
  ggo.onclick = () => { reset(); ggo.textContent = 'Restart'; ggo.blur(); };
  reset();
  loop();
  return () => {
    cancelAnimationFrame(raf);
    document.removeEventListener('keydown', onKey);
  };
}

function bricks() {
  app.innerHTML = `
  <div class="panel">
    <div class="hud"><span>Score <b id="bsc">0</b></span><span>Lives <b id="blv">3</b></span><button class="btn" id="bgo">Start</button></div>
    <canvas id="bcv" class="cv" width="320" height="400" aria-label="Brick Breaker board"></canvas>
    <p class="hint">Move with your mouse or finger, or use the arrow keys. Click, tap, or press Space to launch.</p>
  </div>`;
  const cv = document.getElementById('bcv');
  const ctx = cv.getContext('2d');
  const bsc = document.getElementById('bsc');
  const blv = document.getElementById('blv');
  const bgo = document.getElementById('bgo');
  const W = 320, H = 400, PW = 64, PY = H - 30, R = 6;
  const COLORS = ['#ff5d73', '#ffb70a', '#2ec4b6', '#c7b8ff', '#ff8fab'];
  let px, bx, by, dx, dy, lives, score, wall, state, raf;
  function build() {
    wall = [];
    for (let r = 0; r < 5; r++) {
      for (let c = 0; c < 6; c++) {
        wall.push({ x: 6 + c * 52, y: 40 + r * 22, color: COLORS[r], alive: true });
      }
    }
  }
  function reset() {
    px = (W - PW) / 2;
    bx = px + PW / 2;
    by = PY - R - 2;
    dx = 0; dy = 0; lives = 3; score = 0; state = 'ready';
    build();
    bsc.textContent = 0;
    blv.textContent = 3;
  }
  function launch() {
    if (state !== 'ready') return;
    state = 'play';
    dx = 2.5 * (Math.random() < 0.5 ? -1 : 1);
    dy = -3.2;
  }
  function move(x) {
    px = Math.max(0, Math.min(W - PW, x - PW / 2));
  }
  function loseLife() {
    lives--;
    blv.textContent = lives;
    if (lives <= 0) {
      state = 'over';
      bgo.textContent = 'Try again';
    } else {
      state = 'ready';
    }
  }
  function step() {
    if (state === 'ready') {
      bx = px + PW / 2;
      by = PY - R - 2;
      return;
    }
    if (state !== 'play') return;
    bx += dx;
    by += dy;
    if (bx < R || bx > W - R) {
      dx = -dx;
      bx = Math.max(R, Math.min(W - R, bx));
    }
    if (by < R) { dy = Math.abs(dy); by = R; }
    if (dy > 0 && by + R >= PY && by + R <= PY + 12 && bx >= px - R && bx <= px + PW + R) {
      dy = -Math.abs(dy);
      dx = ((bx - (px + PW / 2)) / (PW / 2)) * 3.5;
      if (Math.abs(dx) < 0.8) dx = dx < 0 ? -0.8 : 0.8;
      by = PY - R;
    }
    for (const b of wall) {
      if (!b.alive || bx + R <= b.x || bx - R >= b.x + 48 || by + R <= b.y || by - R >= b.y + 16) continue;
      b.alive = false;
      score += 10;
      bsc.textContent = score;
      const ox = Math.min(bx + R - b.x, b.x + 48 - (bx - R));
      const oy = Math.min(by + R - b.y, b.y + 16 - (by - R));
      if (ox < oy) dx = -dx; else dy = -dy;
      break;
    }
    if (wall.every(b => !b.alive)) {
      state = 'won';
      bgo.textContent = 'Play again';
      return;
    }
    if (by - R > H) loseLife();
  }
  function draw() {
    ctx.fillStyle = '#1d1b3a';
    ctx.fillRect(0, 0, W, H);
    for (const b of wall) {
      if (!b.alive) continue;
      ctx.fillStyle = b.color;
      ctx.fillRect(b.x, b.y, 48, 16);
    }
    ctx.fillStyle = '#f6f3ff';
    ctx.fillRect(px, PY, PW, 10);
    ctx.beginPath();
    ctx.arc(bx, by, R, 0, Math.PI * 2);
    ctx.fill();
    if (state !== 'play') {
      ctx.fillStyle = '#fff';
      ctx.textAlign = 'center';
      ctx.font = '800 24px system-ui, sans-serif';
      const title = { ready: 'Ready?', over: 'Game over', won: 'Wall cleared!' }[state];
      ctx.fillText(title, W / 2, H / 2 + 60);
      ctx.font = '600 16px system-ui, sans-serif';
      ctx.fillText(state === 'ready' ? 'Click, tap, or press Space' : `Score ${score}`, W / 2, H / 2 + 90);
    }
  }
  function loop() {
    step();
    draw();
    raf = requestAnimationFrame(loop);
  }
  const onMove = e => {
    const r = cv.getBoundingClientRect();
    move((e.clientX - r.left) * (W / r.width));
  };
  const onKey = e => {
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
      e.preventDefault();
      move(px + PW / 2 - 14);
    } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
      e.preventDefault();
      move(px + PW / 2 + 14);
    } else if (e.key === ' ' || e.key === 'ArrowUp') {
      e.preventDefault();
      launch();
    }
  };
  cv.addEventListener('pointermove', onMove);
  cv.addEventListener('pointerdown', e => { onMove(e); launch(); });
  document.addEventListener('keydown', onKey);
  bgo.onclick = () => { reset(); bgo.textContent = 'Restart'; bgo.blur(); };
  reset();
  loop();
  return () => {
    cancelAnimationFrame(raf);
    document.removeEventListener('keydown', onKey);
  };
}

function ttt() {
  app.innerHTML = `
  <div class="panel">
    <div class="hud"><span id="tmsg"></span><button class="btn" id="tgo">New game</button></div>
    <div class="board3" id="tb"></div>
    <p class="hint">You are X. The computer plays O.</p>
  </div>`;
  const tb = document.getElementById('tb');
  const tm = document.getElementById('tmsg');
  const LINES = [[0, 1, 2], [3, 4, 5], [6, 7, 8], [0, 3, 6], [1, 4, 7], [2, 5, 8], [0, 4, 8], [2, 4, 6]];
  let cells, over;
  const winner = b => {
    for (const [i, j, k] of LINES) if (b[i] && b[i] === b[j] && b[i] === b[k]) return b[i];
    return b.every(Boolean) ? 'draw' : null;
  };
  const minimax = (b, turn) => {
    const w = winner(b);
    if (w) return w === 'O' ? 10 : w === 'X' ? -10 : 0;
    const scores = [];
    b.forEach((v, i) => {
      if (v) return;
      const nb = b.slice();
      nb[i] = turn;
      scores.push(minimax(nb, turn === 'O' ? 'X' : 'O'));
    });
    return turn === 'O' ? Math.max(...scores) : Math.min(...scores);
  };
  const computerMove = b => {
    let pick = -1, top = -Infinity;
    b.forEach((v, i) => {
      if (v) return;
      const nb = b.slice();
      nb[i] = 'O';
      const s = minimax(nb, 'X');
      if (s > top) { top = s; pick = i; }
    });
    return pick;
  };
  const update = () => {
    tb.innerHTML = cells.map((v, i) =>
      `<button class="cell" data-i="${i}" aria-label="Square ${i + 1}">${v}</button>`).join('');
    const w = winner(cells);
    if (w) {
      over = true;
      tm.textContent = w === 'draw' ? "It's a draw." : w === 'X' ? 'You win!' : 'The computer wins.';
    } else {
      tm.textContent = 'Your turn';
    }
  };
  const newGame = () => { cells = Array(9).fill(''); over = false; update(); };
  tb.onclick = e => {
    const c = e.target.closest('.cell');
    if (!c || over || cells[c.dataset.i]) return;
    cells[c.dataset.i] = 'X';
    if (!winner(cells)) cells[computerMove(cells)] = 'O';
    update();
  };
  document.getElementById('tgo').onclick = newGame;
  newGame();
  return () => {};
}

function pong() {
  app.innerHTML = `
  <div class="panel">
    <div class="hud"><span>You <b id="pa">0</b></span><span>CPU <b id="pb">0</b></span><button class="btn" id="pgo">Start</button></div>

  const pb = document.getElementById('pb');

  const W = 320, H = 420, PH = 70, R = 6;
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  let py, cy, bx, by, dx, dy, a, b, state, raf;
  function serve(dir) {
    bx = W / 2; by = H / 2;
    dx = 3 * dir;
    dy = (Math.random() * 2 - 1) * 2.5;
  }
  function reset() {
    py = cy = (H - PH) / 2;
    a = 0; b = 0; state = 'ready';
    pa.textContent = 0; pb.textContent = 0;
    serve(1);
  }
  function point(playerScored) {
    if (playerScored) { a++; pa.textContent = a; serve(1); }
    else { b++; pb.textContent = b; serve(-1); }
    if (a >= 5 || b >= 5) { state = 'over'; pgo.textContent = 'Play again'; }
  }
  function step() {
    if (state !== 'play') return;
    bx += dx;
    by += dy;
    if (by < R || by > H - R) { dy = -dy; by = clamp(by, R, H - R); }
    if (dx < 0 && bx - R <= 18 && bx + R >= 10 && by >= py - R && by <= py + PH + R) {
      dx = -dx;
      bx = 18 + R;
      dy = clamp(dy + ((by - (py + PH / 2)) / (PH / 2)) * 2, -6, 6);
    }
    if (dx > 0 && bx + R >= W - 18 && bx - R <= W - 10 && by >= cy - R && by <= cy + PH + R) {
      dx = -dx;
      bx = W - 18 - R;
    }
    cy = clamp(cy + clamp((by - (cy + PH / 2)) * 0.07, -3, 3), 0, H - PH);
    if (bx < -R) point(false);
    else if (bx > W + R) point(true);
  }
  function draw() {
    ctx.fillStyle = '#1d1b3a';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = 'rgba(246,243,255,.25)';
    ctx.fillRect(W / 2 - 1, 0, 2, H);
    ctx.fillStyle = '#2ec4b6';
    ctx.fillRect(10, py, 8, PH);
    ctx.fillStyle = '#ff5d73';
    ctx.fillRect(W - 18, cy, 8, PH);
    ctx.fillStyle = '#ffb70a';
    ctx.beginPath();
    ctx.arc(bx, by, R, 0, Math.PI * 2);
    ctx.fill();
    if (state !== 'play') {
      ctx.fillStyle = '#fff';
      ctx.textAlign = 'center';
      ctx.font = '800 24px system-ui, sans-serif';
      ctx.fillText(state === 'over' ? (a > b ? 'You win!' : 'CPU wins') : 'Ready?', W / 2, H / 2 - 40);

  }
  function loop() {
    step();
    draw();
    raf = requestAnimationFrame(loop);
  }
  const follow = e => {
    const r = cv.getBoundingClientRect();
    py = clamp((e.clientY - r.top) * (H / r.height) - PH / 2, 0, H - PH);

  const onKey = e => {

      py = clamp(py - 14, 0, H - PH);
    } else if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') {
      e.preventDefault();
      py = clamp(py + 14, 0, H - PH);
    }
  };
  cv.addEventListener('pointermove', follow);

  document.addEventListener('keydown', onKey);
  pgo.onclick = () => { reset(); state = 'play'; pgo.textContent = 'Restart'; pgo.blur(); };

  return () => {
    cancelAnimationFrame(raf);
    document.removeEventListener('keydown', onKey);
  };
}

    <div class='board2' id='eb'></div>

  eb.innerHTML = COL.map((c, i) => `<button class='pad4' data-i='${i}' style='background:${c}' aria-label='Color ${i + 1}'></button>`).join('');
  const timers = [];
  const later = (fn, ms) => timers.push(setTimeout(fn, ms));
  let seq = [], input = [], busy = true;
  const flash = i => {
    const el = eb.children[i];
    el.classList.add('lit');
    later(() => el.classList.remove('lit'), 350);
  };
  function playSeq() {
    busy = true;
    em.textContent = 'Watch...';
    seq.forEach((v, k) => later(() => flash(v), 600 + k * 550));
    later(() => { busy = false; input = []; em.textContent = 'Your turn.'; }, 600 + seq.length * 550);
  }

    const i = +b.dataset.i;

    const k = input.length - 1;
    if (input[k] !== seq[k]) {
      const done = seq.length - 1;
      seq = [];

      em.textContent = `Wrong! You finished ${done} round${done === 1 ? '' : 's'}.`;
      ego.textContent = 'Try again';

    }
  };

}

function merge() {
  app.innerHTML = `
  <div class='panel'>
    <div class='hud'><span>Score <b id='ms'>0</b></span><button class='btn' id='mgo'>New game</button></div>
    <div class='board4' id='mb'></div>
    <p class='hint' id='mm'>Slide with arrow keys, WASD, or a swipe. Merge matching tiles.</p>
  </div>`;
  const mb = document.getElementById('mb');
  const ms = document.getElementById('ms');
  const mm = document.getElementById('mm');
  const COLORS = { 2: '#ffe8b3', 4: '#ffd08a', 8: '#ffb36b', 16: '#ff9a6b', 32: '#ff7b73', 64: '#ff5d73' };
  let g, score, over, won;
  const add = () => {
    const empty = [];
    g.forEach((v, i) => { if (!v) empty.push(i); });
    if (empty.length) g[empty[rand(empty.length)]] = Math.random() < 0.9 ? 2 : 4;
  };
  const canMove = () => g.some((v, i) => !v || (i % 4 < 3 && v === g[i + 1]) || (i < 12 && v === g[i + 4]));
  const draw = () => {
    mb.innerHTML = g.map(v => `<div class='tile2' style='background:${v ? (COLORS[v] || '#c7b8ff') : 'var(--line)'}'>${v || ''}</div>`).join('');
  };
  const newGame = () => {
    g = Array(16).fill(0);
    score = 0; over = false; won = false;
    add(); add();
    ms.textContent = 0;
    mm.textContent = 'Slide with arrow keys, WASD, or a swipe. Merge matching tiles.';
    draw();
  };
  function slide(dir) {
    if (over) return;
    let moved = false;
    for (let k = 0; k < 4; k++) {
      const idx = [0, 1, 2, 3].map(j =>
        dir === 'L' ? k * 4 + j : dir === 'R' ? k * 4 + 3 - j : dir === 'U' ? j * 4 + k : (3 - j) * 4 + k);
      const vals = idx.map(i => g[i]).filter(Boolean);
      const out = [];
      for (let j = 0; j < vals.length; j++) {
        if (vals[j] === vals[j + 1]) { out.push(vals[j] * 2); score += vals[j] * 2; j++; }
        else out.push(vals[j]);
      }
      while (out.length < 4) out.push(0);
      idx.forEach((i, j) => { if (g[i] !== out[j]) moved = true; g[i] = out[j]; });
    }
    if (!moved) return;
    add();
    ms.textContent = score;
    if (!won && g.includes(64)) { won = true; mm.textContent = 'You made 64! Keep going or start a new game.'; }
    if (!canMove()) { over = true; mm.textContent = 'No moves left. Press New game to try again.'; }
    draw();
  }
  const KEYS = { ArrowLeft: 'L', a: 'L', A: 'L', ArrowRight: 'R', d: 'R', D: 'R', ArrowUp: 'U', w: 'U', W: 'U', ArrowDown: 'D', s: 'D', S: 'D' };
  const onKey = e => { const d = KEYS[e.key]; if (d) { e.preventDefault(); slide(d); } };
  let sx = 0, sy = 0;
  mb.addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
  mb.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
    slide(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'R' : 'L') : (dy > 0 ? 'D' : 'U'));
  });
  document.addEventListener('keydown', onKey);
  document.getElementById('mgo').onclick = e => { newGame(); e.currentTarget.blur(); };
  newGame();
  return () => document.removeEventListener('keydown', onKey);
}

function connect() {
  app.innerHTML = `
  <div class='panel'>
    <div class='hud'><span id='cm'>Your turn (red)</span><button class='btn' id='cgo'>New game</button></div>
    <div class='board7' id='cb'></div>
    <p class='hint'>Get four discs in a row before the computer does. Click any slot in a column.</p>
  </div>`;
  const cb = document.getElementById('cb');
  const cm = document.getElementById('cm');
  const R = 6, C = 7;
  let g, over;
  const landing = c => { for (let r = R - 1; r >= 0; r--) if (!g[r][c]) return r; return -1; };
  const full = () => g[0].every(Boolean);
  const won = p => {
    for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) {
      if (g[r][c] !== p) continue;
      for (const [dr, dc] of [[0, 1], [1, 0], [1, 1], [1, -1]]) {
        let k = 1;
        while (k < 4 && g[r + dr * k] && g[r + dr * k][c + dc * k] === p) k++;
        if (k === 4) return true;
      }
    }
    return false;
  };
  const cpuMove = () => {
    const cols = [0, 1, 2, 3, 4, 5, 6].filter(c => landing(c) >= 0);
    for (const p of ['Y', 'R']) {
      for (const c of cols) {
        const r = landing(c);
        g[r][c] = p;
        const hit = won(p);
        g[r][c] = '';
        if (hit) return c;
      }
    }
    return cols.sort((a, b) => Math.abs(a - 3) - Math.abs(b - 3))[0];
  };
  const draw = () => {
    cb.innerHTML = g.flat().map((v, i) =>
      `<button class='slot${v === 'R' ? ' red' : v === 'Y' ? ' yel' : ''}' data-c='${i % C}' aria-label='Column ${(i % C) + 1}'></button>`).join('');
  };
  const end = msg => { over = true; cm.textContent = msg; draw(); };
  cb.onclick = e => {
    const s = e.target.closest('.slot');
    if (!s || over) return;
    const c = +s.dataset.c;
    const r = landing(c);
    if (r < 0) return;
    g[r][c] = 'R';
    if (won('R')) return end('You win!');
    if (full()) return end(`It's a draw.`);
    const cc = cpuMove();
    g[landing(cc)][cc] = 'Y';
    if (won('Y')) return end('The computer wins.');
    if (full()) return end(`It's a draw.`);
    cm.textContent = 'Your turn (red)';
    draw();
  };
  const newGame = () => {
    g = Array.from({ length: R }, () => Array(C).fill(''));
    over = false;
    cm.textContent = 'Your turn (red)';
    draw();
  };
  document.getElementById('cgo').onclick = e => { newGame(); e.currentTarget.blur(); };
  newGame();
  return () => {};
}

function mines(N0 = 9, M0 = 10) {
  app.innerHTML = `
  <div class='panel'>
    <div class='hud'><span>Mines <b id='mn'>10</b></span><button class='btn' id='mfl'>Flag: off</button><button class='btn' id='mgo'>New game</button></div>
    <div class='mines' id='mf'></div>
    <p class='hint' id='mt'>Tap a square to open it. Turn Flag on, or right-click, to mark mines.</p>
  </div>`;
  const N = N0, M = M0;
  const mf = document.getElementById('mf');
  mf.style.gridTemplateColumns = `repeat(${N}, 1fr)`;
  const mn = document.getElementById('mn');
  const mt = document.getElementById('mt');
  const fl = document.getElementById('mfl');
  let cells, over, first, flagMode = false;
  const around = i => {
    const r = Math.floor(i / N), c = i % N, out = [];
    for (let a = -1; a <= 1; a++) for (let b = -1; b <= 1; b++) {
      const rr = r + a, cc = c + b;
      if ((a || b) && rr >= 0 && rr < N && cc >= 0 && cc < N) out.push(rr * N + cc);
    }
    return out;
  };
  const draw = () => {
    mf.innerHTML = cells.map((c, i) => `<button class='mc${c.open ? ' open' : ''}${c.boom ? ' boom' : ''}' data-i='${i}' aria-label='Square ${i + 1}'>${c.open ? (c.mine ? '💣' : c.n || '') : c.flag ? '🚩' : ''}</button>`).join('');
    mn.textContent = M - cells.filter(c => c.flag).length;
  };
  const newGame = () => {
    cells = Array.from({ length: N * N }, () => ({ mine: false, open: false, flag: false, boom: false, n: 0 }));
    over = false; first = true;
    mt.textContent = 'Tap a square to open it. Turn Flag on, or right-click, to mark mines.';
    draw();
  };
  const plant = safe => {
    let k = 0;
    while (k < M) {
      const i = rand(N * N);
      if (i !== safe && !cells[i].mine) { cells[i].mine = true; k++; }
    }
    cells.forEach((c, i) => { c.n = around(i).filter(j => cells[j].mine).length; });
  };
  const reveal = i => {
    const stack = [i];
    while (stack.length) {
      const j = stack.pop(), c = cells[j];
      if (c.open || c.flag) continue;
      c.open = true;
      if (!c.n) stack.push(...around(j));
    }
  };
  mf.onclick = e => {
    const b = e.target.closest('.mc');
    if (!b || over) return;
    const i = +b.dataset.i, c = cells[i];
    if (flagMode) {
      if (!c.open) c.flag = !c.flag;
    } else {
      if (c.open || c.flag) return;
      if (first) { plant(i); first = false; }
      if (c.mine) {
        over = true; c.boom = true;
        cells.forEach(x => { if (x.mine) x.open = true; });
        mt.textContent = 'Boom! Press New game to try again.';
      } else {
        reveal(i);
        if (cells.every(x => x.mine || x.open)) { over = true; mt.textContent = 'You cleared the field!'; }
      }
    }
    draw();
  };
  mf.oncontextmenu = e => {
    e.preventDefault();
    const b = e.target.closest('.mc');
    if (!b || over) return;
    const c = cells[+b.dataset.i];
    if (!c.open) { c.flag = !c.flag; draw(); }
  };
  fl.onclick = () => { flagMode = !flagMode; fl.textContent = 'Flag: ' + (flagMode ? 'on' : 'off'); fl.blur(); };
  document.getElementById('mgo').onclick = e => { newGame(); e.currentTarget.blur(); };
  newGame();
  return () => {};
}

function words() {
  const LIST = ['apple', 'brave', 'cloud', 'dream', 'eagle', 'flame', 'grape', 'house', 'input', 'jelly', 'knife', 'lemon', 'magic', 'night', 'ocean', 'piano', 'queen', 'river', 'smile', 'tiger', 'uncle', 'vivid', 'water', 'young', 'zebra', 'beach', 'candy', 'dance', 'earth', 'fresh', 'green', 'happy', 'light', 'money', 'north', 'pizza', 'quick', 'robot', 'sugar', 'train'];
  app.innerHTML = `
  <div class='panel'>
    <div class='hud'><span id='wm'></span><button class='btn' id='wgo'>New word</button></div>
    <div id='wb'></div>
    <input class='inp' id='wi' maxlength='5' autocomplete='off' autocapitalize='off' spellcheck='false' placeholder='Type 5 letters, press Enter'>
    <p class='hint'>Green: right spot. Yellow: wrong spot. Grey: not in the word. You get 6 tries.</p>
  </div>`;
  const wb = document.getElementById('wb');
  const wm = document.getElementById('wm');
  const wi = document.getElementById('wi');
  let secret, rows;
  const score = g => {
    const res = Array(5).fill('x'), left = secret.split('');
    for (let i = 0; i < 5; i++) if (g[i] === secret[i]) { res[i] = 'g'; left[i] = null; }
    for (let i = 0; i < 5; i++) {
      if (res[i] === 'g') continue;
      const k = left.indexOf(g[i]);
      if (k > -1) { res[i] = 'y'; left[k] = null; }
    }
    return res;
  };
  const draw = () => {
    wb.innerHTML = Array.from({ length: 6 }, (_, r) => {
      const row = rows[r];
      return `<div class='wg'>` + Array.from({ length: 5 }, (_, c) => row ? `<div class='wl ${row.s[c]}'>${row.g[c]}</div>` : `<div class='wl'></div>`).join('') + `</div>`;
    }).join('');
  };
  const newGame = () => {
    secret = LIST[rand(LIST.length)];
    rows = [];
    wm.textContent = 'Guess the 5-letter word';
    wi.value = '';
    wi.disabled = false;
    draw();
  };
  wi.onkeydown = e => {
    if (e.key !== 'Enter') return;
    const g = wi.value.toLowerCase().trim();
    if (!/^[a-z]{5}$/.test(g)) { wm.textContent = 'Enter exactly 5 letters'; return; }
    rows.push({ g, s: score(g) });
    wi.value = '';
    if (g === secret) { wm.textContent = 'You got it!'; wi.disabled = true; }
    else if (rows.length === 6) { wm.textContent = 'The word was ' + secret.toUpperCase(); wi.disabled = true; }
    else wm.textContent = (6 - rows.length) + ' tries left';
    draw();
  };
  document.getElementById('wgo').onclick = e => { newGame(); e.currentTarget.blur(); };
  newGame();
  return () => {};
}

function slide9() {
  app.innerHTML = `
  <div class='panel'>
    <div class='hud'><span>Moves <b id='sm'>0</b></span><button class='btn' id='sgo'>Shuffle</button></div>
    <div class='board3' id='sb'></div>
    <p class='hint' id='st'>Slide the tiles into order, 1 to 8.</p>
  </div>`;
  const sb = document.getElementById('sb');
  const sm = document.getElementById('sm');
  const st = document.getElementById('st');
  let t, moves;
  const adj = (i, j) => Math.abs(Math.floor(i / 3) - Math.floor(j / 3)) + Math.abs((i % 3) - (j % 3)) === 1;
  const draw = () => {
    sb.innerHTML = t.map((v, i) => `<button class='cell${v ? '' : ' empty'}' data-i='${i}' aria-label='${v ? 'Tile ' + v : 'Empty'}'>${v || ''}</button>`).join('');
  };
  const shuffle = () => {
    t = [1, 2, 3, 4, 5, 6, 7, 8, 0];
    let z = 8, prev = -1;
    for (let k = 0; k < 200; k++) {
      const opts = [0, 1, 2, 3, 4, 5, 6, 7, 8].filter(i => adj(i, z) && i !== prev);
      const n = opts[rand(opts.length)];
      t[z] = t[n]; t[n] = 0; prev = z; z = n;
    }
    moves = 0;
    sm.textContent = 0;
    st.textContent = 'Slide the tiles into order, 1 to 8.';
    draw();
  };
  sb.onclick = e => {
    const c = e.target.closest('.cell');
    if (!c) return;
    const i = +c.dataset.i, z = t.indexOf(0);
    if (!t[i] || !adj(i, z)) return;
    t[z] = t[i]; t[i] = 0;
    sm.textContent = ++moves;
    if (t.every((v, k) => v === (k + 1) % 9)) st.textContent = `Solved in ${moves} moves!`;
    draw();
  };
  document.getElementById('sgo').onclick = e => { shuffle(); e.currentTarget.blur(); };
  shuffle();
  return () => {};
}

function runner() {
  app.innerHTML = `
  <div class='panel'>
    <div class='hud'><span>Score <b id='rs'>0</b></span><button class='btn' id='rgo'>Start</button></div>
    <canvas id='rcv' class='cv' width='320' height='200' aria-label='Jump Runner board'></canvas>
    <p class='hint'>Press Space, tap, or click to jump over the blocks.</p>
  </div>`;
  const cv = document.getElementById('rcv');
  const ctx = cv.getContext('2d');
  const rs = document.getElementById('rs');
  const rgo = document.getElementById('rgo');
  const W = 320, H = 200, G = 160;
  let y, vy, obs, tick, state, raf;
  const reset = () => { y = G; vy = 0; obs = []; tick = 0; state = 'ready'; rs.textContent = 0; };
  const jump = () => {
    if (state === 'ready') state = 'play';
    if (state === 'play' && y >= G) vy = -9.5;
  };
  function step() {
    tick++;
    vy += 0.6;
    y = Math.min(G, y + vy);
    if (y >= G) vy = 0;
    const speed = 3 + tick / 1200;
    if (!obs.length || obs[obs.length - 1].x < W - 170 - rand(100)) obs.push({ x: W, w: 16 + rand(14), h: 18 + rand(22) });
    obs.forEach(o => { o.x -= speed; });
    obs = obs.filter(o => o.x > -40);
    rs.textContent = Math.floor(tick / 6);
    for (const o of obs) {
      if (70 > o.x && 50 < o.x + o.w && y + 20 > 180 - o.h) { state = 'over'; rgo.textContent = 'Try again'; }
    }
  }
  function draw() {
    ctx.fillStyle = '#1d1b3a';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#5f5a7a';
    ctx.fillRect(0, 180, W, 2);
    ctx.fillStyle = '#ffb70a';
    ctx.fillRect(50, y, 20, 20);
    ctx.fillStyle = '#ff5d73';
    obs.forEach(o => ctx.fillRect(o.x, 180 - o.h, o.w, o.h));
    if (state !== 'play') {
      ctx.fillStyle = '#fff';
      ctx.textAlign = 'center';
      ctx.font = '800 22px system-ui, sans-serif';
      ctx.fillText(state === 'over' ? 'Crash!' : 'Ready?', W / 2, 70);
      ctx.font = '600 15px system-ui, sans-serif';
      ctx.fillText(state === 'over' ? 'Score ' + Math.floor(tick / 6) + '. Press Try again.' : 'Tap or press Space to start', W / 2, 98);
    }
  }
  function loop() {
    if (state === 'play') step();
    draw();
    raf = requestAnimationFrame(loop);
  }
  const onKey = e => {
    if (e.code === 'Space' || e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') { e.preventDefault(); jump(); }
  };
  document.addEventListener('keydown', onKey);
  cv.addEventListener('pointerdown', jump);
  rgo.onclick = () => { reset(); rgo.textContent = 'Restart'; rgo.blur(); };
  reset();
  loop();
  return () => { cancelAnimationFrame(raf); document.removeEventListener('keydown', onKey); };
}

function typer() {
  const LIST = ['sun', 'jump', 'cloud', 'pixel', 'arcade', 'rocket', 'banana', 'window', 'garden', 'planet', 'tiger', 'magic', 'river', 'candy', 'storm', 'light', 'happy', 'quick', 'brave', 'dream', 'ocean', 'smile', 'music', 'robot', 'pizza'];
  app.innerHTML = `
  <div class='panel'>
    <div class='hud'><span>Score <b id='ts'>0</b></span><span>Time <b id='tt'>30</b></span><button class='btn' id='tgo'>Start</button></div>
    <div class='big' id='tw'>Ready?</div>
    <input class='inp' id='ti' autocomplete='off' autocapitalize='off' spellcheck='false' disabled placeholder='Type the word here'>
    <p class='hint' id='tm'>Press Start. Each word advances as soon as you type it right.</p>
  </div>`;
  const ts = document.getElementById('ts');
  const tt = document.getElementById('tt');
  const tw = document.getElementById('tw');
  const ti = document.getElementById('ti');
  const tm = document.getElementById('tm');
  const tgo = document.getElementById('tgo');
  let score = 0, time = 30, word = '', timer, running = false;
  const next = () => { word = LIST[rand(LIST.length)]; tw.textContent = word; ti.value = ''; };
  tgo.onclick = () => {
    clearInterval(timer);
    score = 0; time = 30; running = true;
    ts.textContent = 0; tt.textContent = 30;
    ti.disabled = false; ti.focus();
    next();
    tm.textContent = 'Type fast!';
    tgo.textContent = 'Restart';
    timer = setInterval(() => {
      tt.textContent = --time;
      if (time <= 0) {
        clearInterval(timer);
        running = false;
        ti.disabled = true;
        tw.textContent = 'Time!';
        tm.textContent = `You typed ${score} words.`;
        tgo.textContent = 'Play again';
      }
    }, 1000);
  };
  ti.oninput = () => {
    if (running && ti.value.trim().toLowerCase() === word) { ts.textContent = ++score; next(); }
  };
  return () => clearInterval(timer);
}

function lights() {
  app.innerHTML = `
  <div class='panel'>
    <div class='hud'><span>Moves <b id='lm'>0</b></span><button class='btn' id='lgo'>New puzzle</button></div>
    <div class='board5' id='lb'></div>
    <p class='hint' id='lt'>Tap a lamp to flip it and its neighbors. Turn them all off.</p>
  </div>`;
  const lb = document.getElementById('lb');
  const lm = document.getElementById('lm');
  const lt = document.getElementById('lt');
  let g, moves;
  const flip = i => {
    const r = Math.floor(i / 5), c = i % 5;
    [[0, 0], [1, 0], [-1, 0], [0, 1], [0, -1]].forEach(([a, b]) => {
      const rr = r + a, cc = c + b;
      if (rr >= 0 && rr < 5 && cc >= 0 && cc < 5) g[rr * 5 + cc] = !g[rr * 5 + cc];
    });
  };
  const draw = () => {
    lb.innerHTML = g.map((v, i) => `<button class='lamp${v ? ' on' : ''}' data-i='${i}' aria-label='Lamp ${i + 1}'></button>`).join('');
  };
  const newGame = () => {
    g = Array(25).fill(false);
    for (let k = 0; k < 12; k++) flip(rand(25));
    if (!g.some(Boolean)) flip(12);
    moves = 0;
    lm.textContent = 0;
    lt.textContent = 'Tap a lamp to flip it and its neighbors. Turn them all off.';
    draw();
  };
  lb.onclick = e => {
    const b = e.target.closest('.lamp');
    if (!b) return;
    flip(+b.dataset.i);
    lm.textContent = ++moves;
    if (!g.some(Boolean)) lt.textContent = `All lights off in ${moves} moves!`;
    draw();
  };
  document.getElementById('lgo').onclick = e => { newGame(); e.currentTarget.blur(); };
  newGame();
  return () => {};
}

function fruit() {
  app.innerHTML = `
  <div class='panel'>
    <div class='hud'><span>Score <b id='cs'>0</b></span><span>Lives <b id='cl'>3</b></span><button class='btn' id='cgo'>Start</button></div>
    <canvas id='ccv' class='cv' width='320' height='420' aria-label='Fruit Catch board'></canvas>
    <p class='hint'>Move your mouse or finger, or use the arrow keys, to catch the fruit. Missing three ends the game.</p>
  </div>`;
  const cv = document.getElementById('ccv');
  const ctx = cv.getContext('2d');
  const cs = document.getElementById('cs');
  const cl = document.getElementById('cl');
  const cgo = document.getElementById('cgo');
  const W = 320, H = 420, BW = 64, FRUITS = ['🍎', '🍌', '🍇', '🍓', '🍊'];
  let bx, items, score, lives, state, tick, raf;
  const reset = () => { bx = (W - BW) / 2; items = []; score = 0; lives = 3; state = 'ready'; tick = 0; cs.textContent = 0; cl.textContent = 3; };
  const move = x => { bx = Math.max(0, Math.min(W - BW, x - BW / 2)); };
  function step() {
    if (state !== 'play') return;
    tick++;
    if (tick % 40 === 0) items.push({ x: 14 + rand(W - 28), y: -12, e: FRUITS[rand(5)], v: 2 + Math.min(4, score / 100) });
    items.forEach(o => { o.y += o.v; });
    items = items.filter(o => {
      if (o.y > H - 34 && o.y < H - 10 && o.x > bx - 6 && o.x < bx + BW + 6) { score += 10; cs.textContent = score; return false; }
      if (o.y > H + 10) {
        lives--;
        cl.textContent = lives;
        if (lives <= 0) { state = 'over'; cgo.textContent = 'Try again'; }
        return false;
      }
      return true;
    });
  }
  function draw() {
    ctx.fillStyle = '#1d1b3a';
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.font = '26px sans-serif';
    items.forEach(o => ctx.fillText(o.e, o.x, o.y));
    ctx.fillStyle = '#2ec4b6';
    ctx.fillRect(bx, H - 24, BW, 16);
    if (state !== 'play') {
      ctx.fillStyle = '#fff';
      ctx.font = '800 24px system-ui, sans-serif';
      ctx.fillText(state === 'over' ? 'Game over' : 'Ready?', W / 2, H / 2 - 20);
      ctx.font = '600 16px system-ui, sans-serif';
      ctx.fillText(state === 'over' ? 'Score ' + score + '. Press Try again.' : 'Press Start or tap the board', W / 2, H / 2 + 10);
    }
  }
  function loop() {
    step();
    draw();
    raf = requestAnimationFrame(loop);
  }
  const follow = e => {
    const r = cv.getBoundingClientRect();
    move((e.clientX - r.left) * (W / r.width));
  };
  const onKey = e => {
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') { e.preventDefault(); move(bx + BW / 2 - 18); }
    else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') { e.preventDefault(); move(bx + BW / 2 + 18); }
  };
  cv.addEventListener('pointermove', follow);
  cv.addEventListener('pointerdown', e => { follow(e); if (state === 'ready') state = 'play'; });
  document.addEventListener('keydown', onKey);
  cgo.onclick = () => { reset(); state = 'play'; cgo.textContent = 'Restart'; cgo.blur(); };
  reset();
  loop();
  return () => { cancelAnimationFrame(raf); document.removeEventListener('keydown', onKey); };
}

/* ----- Quiz engine: 4 choices, 10 questions, data-driven ----- */
function quiz(pairs, tpl) {
  return () => {
    const N = Math.min(10, pairs.length);
    app.innerHTML = `
    <div class='panel'>
      <div class='hud'><span>Score <b id='qs'>0</b> / ${N}</span><button class='btn' id='qr'>Restart</button></div>
      <div class='big' id='qq'></div><div class='opts' id='qo'></div><p class='hint' id='qm'></p>
    </div>`;
    const qq = $('qq'), qo = $('qo'), qm = $('qm'), qs = $('qs');
    let deck, i, score, lock, timer;
    const show = () => {
      const [p, a] = deck[i];
      qq.textContent = tpl.replace('{0}', p);
      qq.style.fontSize = tpl === '{0}' && p.length <= 4 ? '3.2rem' : '1.4rem';
      const wrong = shuffle([...new Set(pairs.map(x => x[1]))].filter(x => x !== a)).slice(0, 3);
      qo.innerHTML = shuffle([a, ...wrong]).map(o => `<button class='opt'>${o}</button>`).join('');
      qm.textContent = `Question ${i + 1} of ${N}`;
      lock = false;
    };
    const start = () => { deck = pick(pairs, N); i = 0; score = 0; qs.textContent = 0; show(); };
    qo.onclick = e => {
      const b = e.target.closest('.opt');
      if (!b || lock) return;
      lock = true;
      const a = deck[i][1];
      if (b.textContent === a) { score++; qs.textContent = score; b.classList.add('ok'); }
      else { b.classList.add('no'); [...qo.children].forEach(x => { if (x.textContent === a) x.classList.add('ok'); }); }
      timer = setTimeout(() => {
        i++;
        if (i < N) show();
        else { qq.style.fontSize = '1.6rem'; qq.textContent = score === N ? 'Perfect score!' : 'Finished!'; qo.innerHTML = ''; qm.textContent = `You got ${score} out of ${N}. Press Restart to play again.`; }
      }, 900);
    };
    $('qr').onclick = () => { clearTimeout(timer); start(); };
    start();
    return () => clearTimeout(timer);
  };
}

/* ----- Math sprint engine: 30 seconds, 4 choices ----- */
function sprint(gen) {
  return () => {
    app.innerHTML = `
    <div class='panel'>
      <div class='hud'><span>Score <b id='ps'>0</b></span><span>Time <b id='pt'>30</b></span><button class='btn' id='pg'>Start</button></div>
      <div class='big' id='pq'>Ready?</div><div class='opts' id='po'></div>
      <p class='hint' id='pm'>Press Start. Answer as many as you can in 30 seconds. Wrong answers cost a point.</p>
    </div>`;
    const ps = $('ps'), pt = $('pt'), pq = $('pq'), po = $('po'), pm = $('pm'), pg = $('pg');
    let cur, score = 0, time = 30, running = false, timer;
    const next = () => {
      cur = gen();
      let opts = cur.o;
      if (!opts) {
        const s = new Set([cur.a]);
        while (s.size < 4) { const d = cur.a + rand(11) - 5; if (d >= 0) s.add(d); }
        opts = shuffle([...s]);
      }
      pq.textContent = cur.q;
      po.innerHTML = opts.map(o => `<button class='opt'>${o}</button>`).join('');
    };
    po.onclick = e => {
      const b = e.target.closest('.opt');
      if (!b || !running) return;
      score = Math.max(0, score + (b.textContent === String(cur.a) ? 1 : -1));
      ps.textContent = score;
      next();
    };
    pg.onclick = () => {
      clearInterval(timer);
      score = 0; time = 30; running = true;
      ps.textContent = 0; pt.textContent = 30;
      pm.textContent = 'Go!';
      pg.textContent = 'Restart';
      next();
      timer = setInterval(() => {
        pt.textContent = --time;
        if (time <= 0) {
          clearInterval(timer);
          running = false;
          po.innerHTML = '';
          pq.textContent = 'Time!';
          pm.textContent = 'Final score: ' + score;
          pg.textContent = 'Play again';
        }
      }, 1000);
    };
    return () => clearInterval(timer);
  };
}

function hang(list) {
  return () => {
    app.innerHTML = `
    <div class='panel'>
      <div class='hud'><span>Lives <b id='hl'>6</b></span><button class='btn' id='hr'>New word</button></div>
      <div class='big' id='hw'></div><div class='keys' id='hk'></div><p class='hint' id='hm'></p>
    </div>`;
    const hk = $('hk'), hm = $('hm');
    let w, got, lives, over;
    const draw = () => {
      $('hw').textContent = [...w].map(c => got.has(c) ? c : '_').join(' ').toUpperCase();
      $('hl').textContent = lives;
      hk.innerHTML = 'abcdefghijklmnopqrstuvwxyz'.split('').map(c => `<button class='key' data-c='${c}'${got.has(c) || over ? ' disabled' : ''}>${c}</button>`).join('');
    };
    const guess = c => {
      if (over || got.has(c)) return;
      got.add(c);
      if (!w.includes(c)) lives--;
      if ([...w].every(x => got.has(x))) { over = true; hm.textContent = 'You won!'; }
      else if (lives <= 0) { over = true; hm.textContent = 'Out of lives. The word was ' + w.toUpperCase(); }
      draw();
    };
    const start = () => { w = list[rand(list.length)]; got = new Set(); lives = 6; over = false; hm.textContent = 'Click or type letters to guess.'; draw(); };
    hk.onclick = e => { const b = e.target.closest('.key'); if (b) guess(b.dataset.c); };
    const onKey = e => { if (/^[a-z]$/i.test(e.key) && !e.ctrlKey && !e.metaKey) guess(e.key.toLowerCase()); };
    document.addEventListener('keydown', onKey);
    $('hr').onclick = e => { start(); e.currentTarget.blur(); };
    start();
    return () => document.removeEventListener('keydown', onKey);
  };
}

function dodge() {
  app.innerHTML = `
  <div class='panel'>
    <div class='hud'><span>Score <b id='ds'>0</b></span><button class='btn' id='dg'>Start</button></div>
    <canvas id='dcv' class='cv' width='320' height='420' aria-label='Dodge game board'></canvas>
    <p class='hint'>Move with your mouse, finger, or arrow keys. Click, tap, or press Space to start. Avoid the red blocks.</p>
  </div>`;
  const cv = $('dcv'), ctx = cv.getContext('2d');
  const W = 320, H = 420, PW = 36;
  let px, blocks, tick, state, raf;
  const reset = () => { px = W / 2 - PW / 2; blocks = []; tick = 0; state = 'ready'; $('ds').textContent = 0; };
  const move = x => { px = Math.max(0, Math.min(W - PW, x - PW / 2)); };
  function step() {
    tick++;
    if (tick % Math.max(14, 40 - Math.floor(tick / 150)) === 0) {
      const w = 24 + rand(40);
      blocks.push({ x: rand(W - w), y: -20, w, v: 2.5 + Math.min(4, tick / 600) });
    }
    blocks.forEach(b => { b.y += b.v; });
    blocks = blocks.filter(b => b.y < H + 20);
    $('ds').textContent = Math.floor(tick / 6);
    for (const b of blocks) {
      if (b.y + 16 > H - 30 && b.y < H - 10 && b.x < px + PW && b.x + b.w > px) { state = 'over'; $('dg').textContent = 'Try again'; }
    }
  }
  function draw() {
    ctx.fillStyle = '#1d1b3a';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#ff5d73';
    blocks.forEach(b => ctx.fillRect(b.x, b.y, b.w, 16));
    ctx.fillStyle = '#2ec4b6';
    ctx.fillRect(px, H - 30, PW, 20);
    if (state !== 'play') {
      ctx.fillStyle = '#fff';
      ctx.textAlign = 'center';
      ctx.font = '800 24px system-ui, sans-serif';
      ctx.fillText(state === 'over' ? 'Crash!' : 'Ready?', W / 2, H / 2 - 20);
      ctx.font = '600 16px system-ui, sans-serif';
      ctx.fillText(state === 'over' ? 'Score ' + Math.floor(tick / 6) + '. Press Try again.' : 'Click, tap, or press Space', W / 2, H / 2 + 10);
    }
  }
  function loop() {
    if (state === 'play') step();
    draw();
    raf = requestAnimationFrame(loop);
  }
  const follow = e => { const r = cv.getBoundingClientRect(); move((e.clientX - r.left) * (W / r.width)); };
  const onKey = e => {
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') { e.preventDefault(); move(px + PW / 2 - 18); }
    else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') { e.preventDefault(); move(px + PW / 2 + 18); }
    else if (e.code === 'Space') { e.preventDefault(); if (state === 'ready') state = 'play'; }
  };
  cv.addEventListener('pointermove', follow);
  cv.addEventListener('pointerdown', e => { follow(e); if (state === 'ready') state = 'play'; });
  document.addEventListener('keydown', onKey);
  $('dg').onclick = () => { reset(); state = 'play'; $('dg').textContent = 'Restart'; $('dg').blur(); };
  reset();
  loop();
  return () => { cancelAnimationFrame(raf); document.removeEventListener('keydown', onKey); };
}

function tower() {
  app.innerHTML = `
  <div class='panel'>
    <div class='hud'><span>Height <b id='ts'>0</b></span><button class='btn' id='tg'>Start</button></div>
    <canvas id='tcv' class='cv' width='320' height='420' aria-label='Tower Stack game board'></canvas>
    <p class='hint'>Tap, click, or press Space to drop the block. Line it up with the tower below.</p>
  </div>`;
  const cv = $('tcv'), ctx = cv.getContext('2d');
  const W = 320, H = 420, BH = 22;
  let stack, cur, dir, state, raf;
  const reset = () => { stack = [{ x: 90, w: 140 }]; cur = { x: 0, w: 140 }; dir = 1; state = 'ready'; $('ts').textContent = 0; };
  const drop = () => {
    if (state === 'ready') { state = 'play'; return; }
    if (state !== 'play') return;
    const top = stack[stack.length - 1];
    const left = Math.max(cur.x, top.x), right = Math.min(cur.x + cur.w, top.x + top.w);
    if (right - left <= 2) { state = 'over'; $('tg').textContent = 'Try again'; return; }
    stack.push({ x: left, w: right - left });
    cur = { x: cur.x, w: right - left };
    $('ts').textContent = stack.length - 1;
  };
  function step() {
    if (state !== 'play') return;
    cur.x += dir * (2 + Math.min(4, stack.length / 8));
    if (cur.x < 0) { cur.x = 0; dir = 1; }
    if (cur.x + cur.w > W) { cur.x = W - cur.w; dir = -1; }
  }
  function draw() {
    ctx.fillStyle = '#1d1b3a';
    ctx.fillRect(0, 0, W, H);
    const off = Math.max(0, (stack.length - 8) * BH);
    stack.forEach((b, i) => {
      ctx.fillStyle = `hsl(${(i * 28) % 360}, 70%, 60%)`;
      ctx.fillRect(b.x, H - (i + 1) * BH + off, b.w, BH - 2);
    });
    if (state !== 'over') {
      ctx.fillStyle = '#f6f3ff';
      ctx.fillRect(cur.x, H - (stack.length + 1) * BH + off, cur.w, BH - 2);
    }
    if (state !== 'play') {
      ctx.fillStyle = '#fff';
      ctx.textAlign = 'center';
      ctx.font = '800 24px system-ui, sans-serif';
      ctx.fillText(state === 'over' ? 'Tower fell!' : 'Ready?', W / 2, 70);
      ctx.font = '600 16px system-ui, sans-serif';
      ctx.fillText(state === 'over' ? 'Height ' + (stack.length - 1) + '. Press Try again.' : 'Tap or press Space to start', W / 2, 100);
    }
  }
  function loop() {
    step();
    draw();
    raf = requestAnimationFrame(loop);
  }
  const onKey = e => { if (e.code === 'Space') { e.preventDefault(); drop(); } };
  document.addEventListener('keydown', onKey);
  cv.addEventListener('pointerdown', drop);
  $('tg').onclick = () => { reset(); $('tg').textContent = 'Restart'; $('tg').blur(); };
  reset();
  loop();
  return () => { cancelAnimationFrame(raf); document.removeEventListener('keydown', onKey); };
}

// ---- Multiplayer: same-device games and online rooms ----
const LOBBY = `<div id='bl'><input class='inp' id='bc' maxlength='12' autocomplete='off' autocapitalize='off' spellcheck='false' placeholder='Room code, like fox42'><div class='hud' style='margin:10px 0 0'><button class='btn' id='bj'>Join room</button><button class='btn' id='br'>Random code</button></div><p class='hint'>Online rooms work for friends who open this page from its shared link.</p></div>`;

function lobby(key, msg, onJoin) {
  $('br').onclick = () => { $('bc').value = pick(['fox', 'owl', 'cat', 'bee', 'elk', 'yak'], 1)[0] + (10 + rand(90)); };
  $('bj').onclick = async () => {
    const code = $('bc').value.trim().toLowerCase().replace(/[^a-z0-9]/g, '');
    if (code.length < 3) { msg('Type a room code with at least 3 letters or numbers.'); return; }
    const rt = window.claude && window.claude.use ? await window.claude.use('room') : null;
    if (!rt) { msg('Online play needs this page opened from its shared link by invited people. Try the same-device version instead.'); return; }
    let room;
    try { room = await rt.join(key + '-' + code); } catch (e) { msg('Could not join that room. Try again.'); return; }
    room.presence({ t: Date.now() });
    $('bl').innerHTML = `<p class='hint' style='margin:0 0 10px'>Room <b>${code}</b>. Your friend opens this same game and joins the same code.</p>`;
    msg('');
    onJoin(room);
  };
}
const duelPlayers = room => room.peers().filter(p => p.kind === 'viewer' && p.presence && p.presence.t).sort((a, b) => a.presence.t - b.presence.t || (a.peer < b.peer ? -1 : 1));

const TTT = {
  key: 'ttt', mark: ['X', 'O'],
  init: () => ({ b: '.........', turn: 0, win: null }),
  move(s, i, p) {
    if (s.win !== null || s.turn !== p || s.b[i] !== '.') return null;
    const ch = 'xo'[p];
    const b = s.b.slice(0, i) + ch + s.b.slice(i + 1);
    const L = [[0, 1, 2], [3, 4, 5], [6, 7, 8], [0, 3, 6], [1, 4, 7], [2, 5, 8], [0, 4, 8], [2, 4, 6]];
    const w = L.some(l => l.every(k => b[k] === ch)) ? p : b.includes('.') ? null : 'd';
    return { b, turn: 1 - p, win: w };
  },
  view: s => `<div class='board3'>${[...s.b].map((c, i) => `<button class='cell' data-i='${i}' aria-label='Square ${i + 1}'>${c === 'x' ? 'X' : c === 'o' ? 'O' : ''}</button>`).join('')}</div>`
};

const C4 = {
  key: 'c4', mark: ['red', 'yellow'],
  init: () => ({ b: '.'.repeat(42), turn: 0, win: null }),
  move(s, c, p) {
    if (s.win !== null || s.turn !== p) return null;
    let r = 5;
    while (r >= 0 && s.b[r * 7 + c] !== '.') r--;
    if (r < 0) return null;
    const ch = 'ry'[p], i = r * 7 + c;
    const b = s.b.slice(0, i) + ch + s.b.slice(i + 1);
    const at = (rr, cc) => rr >= 0 && rr < 6 && cc >= 0 && cc < 7 ? b[rr * 7 + cc] : '';
    let won = false;
    for (let rr = 0; rr < 6; rr++) for (let cc = 0; cc < 7; cc++) for (const [dr, dc] of [[0, 1], [1, 0], [1, 1], [1, -1]]) {
      if (at(rr, cc) === ch && [1, 2, 3].every(k => at(rr + dr * k, cc + dc * k) === ch)) won = true;
    }
    return { b, turn: 1 - p, win: won ? p : b.includes('.') ? null : 'd' };
  },
  view: s => `<div class='board7'>${[...s.b].map((c, i) => `<button class='slot${c === 'r' ? ' red' : c === 'y' ? ' yel' : ''}' data-i='${i % 7}' aria-label='Column ${(i % 7) + 1}'></button>`).join('')}</div>`
};

function board(def, online) {
  return () => {
    app.innerHTML = `
    <div class='panel'>
      ${online ? LOBBY : ''}
      <div class='hud' style='margin-top:14px'><span id='bs'></span><button class='btn' id='bn'>New game</button></div>
      <div id='bb'></div>
      <p class='hint' id='bh'></p>
    </div>`;
    let s = def.init(), room = null, me = -1, off = () => {};
    const bs = $('bs'), bb = $('bb'), bh = $('bh');
    const status = () => {
      if (s.win !== null) return s.win === 'd' ? "It's a draw." : online ? (me < 0 ? `Player ${s.win + 1} wins.` : s.win === me ? 'You win!' : 'You lose.') : `Player ${s.win + 1} wins!`;
      if (!online) return `Player ${s.turn + 1}'s turn (${def.mark[s.turn]})`;
      if (!room) return 'Join a room to play';
      if (me < 0) return 'The room is full. You are watching.';
      if (duelPlayers(room).length < 2) return 'Waiting for a friend to join...';
      return s.turn === me ? `Your turn (${def.mark[me]})` : "Opponent's turn";
    };
    const draw = () => { bb.innerHTML = def.view(s); bs.textContent = status(); };
    const sync = () => {
      const ps = duelPlayers(room);
      me = ps.slice(0, 2).findIndex(p => p.isMe && p.sameTab);
      let best = s;
      ps.forEach(p => { const x = p.presence.s; if (x && typeof x.q === 'number' && x.q > (best.q || 0) && typeof x.b === 'string' && x.b.length === s.b.length && (x.turn === 0 || x.turn === 1) && [null, 0, 1, 'd'].includes(x.win)) best = x; });
      if (best !== s) { s = best; room.presence({ s }); }
      draw();
    };
    bb.onclick = e => {
      const c = e.target.closest('[data-i]');
      if (!c) return;
      const who = online ? me : s.turn;
      if (who < 0) return;
      const n = def.move(s, +c.dataset.i, who);
      if (!n) return;
      n.q = (s.q || 0) + 1;
      n.f = s.f || 0;
      s = n;
      if (online) room.presence({ s });
      draw();
    };
    $('bn').onclick = () => {
      if (online && !room) return;
      const n = def.init();
      n.f = 1 - (s.f || 0);
      n.turn = n.f;
      n.q = (s.q || 0) + 1;
      s = n;
      if (online) room.presence({ s });
      draw();
      $('bn').blur();
    };
    if (online) lobby(def.key, t => { bh.textContent = t; }, r => { room = r; off = room.onPeers(sync); sync(); });
    draw();
    return () => { off(); if (room) room.leave(); };
  };
}

function race(online) {
  return () => {
    const GOAL = 30;
    app.innerHTML = `

        : `<div class='hud' style='gap:10px;margin:0'><button class='tapb' id='t0' style='background:#2ec4b6'>P1 · A</button><button class='tapb' id='t1' style='background:#ff8fa3'>P2 · L</button></div>`}
      <p class='hint' id='gh'></p>
    </div>`;
    let room = null, off = () => {}, g = 0, taps = [0, 0], waiting = true;
    const win = () => taps[0] >= GOAL ? 0 : taps[1] >= GOAL ? 1 : -1;
    const draw = () => {
      $('m0').style.width = Math.min(100, taps[0] * 100 / GOAL) + '%';
      $('m1').style.width = Math.min(100, taps[1] * 100 / GOAL) + '%';
      const w = win();
      $('gt').textContent = w >= 0 ? (online ? (w === 0 ? 'You win!' : 'You lose!') : `Player ${w + 1} wins!`) : online && !room ? 'Join a room first' : online && waiting ? 'Waiting for a friend...' : 'Tap!';
    };
    const sync = () => {
      const others = room.peers().filter(p => !(p.isMe && p.sameTab) && p.kind === 'viewer' && p.presence && p.presence.t);
      const maxg = others.reduce((m, p) => Math.max(m, p.presence.g | 0), g);
      if (maxg > g) { g = maxg; taps = [0, 0]; room.presence({ g, k: 0 }); }
      taps[1] = others.reduce((m, p) => (p.presence.g | 0) === g ? Math.max(m, p.presence.k | 0) : m, 0);
      waiting = others.length === 0;
      draw();
    };
    const tap = i => {
      if (win() >= 0) return;
      if (online) { if (!room || waiting) return; taps[0]++; room.presence({ g, k: taps[0] }); }
      else taps[i]++;
      draw();
    };
    $('t0').onpointerdown = e => { e.preventDefault(); tap(0); };
    if ($('t1')) $('t1').onpointerdown = e => { e.preventDefault(); tap(1); };
    $('gn').onclick = () => {
      taps = [0, 0];
      if (online && room) { g++; room.presence({ g, k: 0 }); }
      draw();
      $('gn').blur();
    };
    const onKey = e => {
      if (e.repeat) return;
      const k = e.key.toLowerCase();
      if (online) { if (k === 'a' || k === ' ') { e.preventDefault(); tap(0); } }
      else if (k === 'a') tap(0);
      else if (k === 'l') tap(1);
    };
    document.addEventListener('keydown', onKey);
    if (online) lobby('race', t => { $('gh').textContent = t; }, r => { room = r; room.presence({ g, k: 0 }); off = room.onPeers(sync); sync(); });
    draw();
    return () => { off(); document.removeEventListener('keydown', onKey); if (room) room.leave(); };
  };
}
